 transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s,background .3s}

tipos.forEach((t,k)=>{const m=document.createElementNS(NS,'marker');m.id='ar'+k;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto');m.innerHTML=`<path d="M1,1 L8,5 L1,9" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;defs.appendChild(m)});
const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e};
const E=edges.map((e,k)=>{const col=tipos[e.type].color;
 const hit=mk('line',{class:'hit'});hit.addEventListener('click',ev=>{ev.stopPropagation();pickEdge(k)});
 const ln=mk('line',{class:'ln','stroke':col,'stroke-width':1.7,'marker-end':'url(#ar'+e.type+')'});
 const ps=[0,1].map(()=>mk('circle',{r:3.2,fill:col,opacity:0}));

 const chip=document.createElement('div');chip.className='chip';chip.textContent=tipos[e.type].name;world.appendChild(chip);
 return{hit,ln,ps,chip,g:0,ph:Math.random()}});
// ---- simulación de fuerzas (sin centro fijo: solo se recentra el conjunto)
function step(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);
 for(let i=0;i<N;i++){P[i].tr=radius(i);P[i].r+=(P[i].tr-P[i].r)*.12}
 if(alpha>.003){
  const a=alpha;
  for(let x=0;x<act.length;x++)for(let y=x+1;y<act.length;y++){const i=act[x],j=act[y],pi=P[i],pj=P[j];let dx=pj.x-pi.x,dy=pj.y-pi.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}const d=Math.sqrt(d2);
   const dd=Math.max(d,70),rep=(70000+(pi.r+pj.r)*1200)*a/(dd*dd*d);pi.vx-=dx*rep;pi.vy-=dy*rep;pj.vx+=dx*rep;pj.vy+=dy*rep;
   const mn=pi.r+pj.r+54;if(d<mn){const f=(mn-d)/d*.5*Math.min(1,a*3+.3);pi.vx-=dx*f;pi.vy-=dy*f;pj.vx+=dx*f;pj.vy+=dy*f}}
  edges.forEach((e,k)=>{if(!edgeOn(k))return;const pi=P[e.s],pj=P[e.t];const dx=pj.x-pi.x,dy=pj.y-pi.y,d=Math.hypot(dx,dy)||1,L=95+pi.r+pj.r,f=(d-L)/d*.12*a;pi.vx+=dx*f;pi.vy+=dy*f;pj.vx-=dx*f;pj.vy-=dy*f});
  let cx=0,cy=0;act.forEach(i=>{cx+=P[i].x;cy+=P[i].y});if(act.length){cx/=act.length;cy/=act.length}
  act.forEach(i=>{const p=P[i];if(p.fx!=null){p.x=p.fx;p.y=p.fy;p.vx=p.vy=0;return}p.vx=Math.max(-24,Math.min(24,(p.vx-p.x*.01*a)*.62));p.vy=Math.max(-24,Math.min(24,(p.vy-p.y*.01*a)*.62));p.x+=p.vx-cx*.05;p.y+=p.vy-cy*.05});

}
// ---- desenredo: al enfriarse, mover levemente los nodos para quitar cruces de flechas y flechas sobre actores
const ccw=(a,b,c)=>(c.y-a.y)*(b.x-a.x)-(b.y-a.y)*(c.x-a.x);
const segX=(a,b,c,d)=>ccw(a,b,c)*ccw(a,b,d)<0&&ccw(c,d,a)*ccw(c,d,b)<0;
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function untangle(act){
 const ae=[];edges.forEach((e,k)=>{if(edgeOn(k))ae.push(e)});
 const inc=new Map();act.forEach(i=>inc.set(i,[]));ae.forEach(e=>{inc.get(e.s).push(e);inc.get(e.t).push(e)});
 const local=i=>{let c=0;for(const e of inc.get(i)){for(const f of ae){if(f===e||f.s===e.s||f.s===e.t||f.t===e.s||f.t===e.t)continue;if(segX(P[e.s],P[e.t],P[f.s],P[f.t]))c+=1000}
   for(const n of act){if(n===e.s||n===e.t)continue;if(distSeg(P[n],P[e.s],P[e.t])<P[n].r+14)c+=1000}c+=Math.hypot(P[e.s].x-P[e.t].x,P[e.s].y-P[e.t].y)*.02}
  for(const f of ae){if(f.s===i||f.t===i)continue;if(distSeg(P[i],P[f.s],P[f.t])<P[i].r+14)c+=1000}
  for(const n of act){if(n===i)continue;if(Math.hypot(P[i].x-P[n].x,P[i].y-P[n].y)<P[i].r+P[n].r+40)c+=800}return c};
 for(let it=0;it<9000&&act.length>2;it++){const i=act[(Math.random()*act.length)|0],ox=P[i].x,oy=P[i].y,b=local(i),s=15+90*(1-it/9000);P[i].x+=(Math.random()-.5)*2*s;P[i].y+=(Math.random()-.5)*2*s;if(local(i)>b){P[i].x=ox;P[i].y=oy}}
}
function reheat(a){alpha=Math.max(alpha,a);untangled=false}
// ---- dibujo
const T0=performance.now();
function draw(now){
 step();
 const t=(now-T0)/1000;
 for(let i=0;i<N;i++){const p=P[i];els[i].style.transform=`translate(${p.x}px,${p.y}px)`;els[i].style.setProperty('--r',p.r.toFixed(1))}
 edges.forEach((e,k)=>{const o=E[k],on=edgeOn(k);o.g+=((on?1:0)-o.g)*.09;if(Math.abs((on?1:0)-o.g)<.01)o.g=on?1:0;
  const a=P[e.s],b=P[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,x1=a.x+ux*(a.r+3),y1=a.y+uy*(a.r+3),x2=b.x-ux*(b.r+5),y2=b.y-uy*(b.r+5),ex=x1+(x2-x1)*o.g,ey=y1+(y2-y1)*o.g;
  const touch=(sel>=0&&(e.s===sel||e.t===sel))||k===selEdge,dim=(sel>=0&&!touch&&k!==selEdge)||(hlType>=0&&e.type!==hlType)||(hlCat>=0&&nodes[e.s].cat!==hlCat&&nodes[e.t].cat!==hlCat);
  for(const l of [o.ln,o.hit]){l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',ex);l.setAttribute('y2',ey)}
  o.ln.style.opacity=o.g*(dim?.2:touch?1:.7);o.ln.setAttribute('stroke-width',(opts.thick?1+.9*e.w:1.7)+(touch?1.1:0));o.hit.classList.toggle('on',on);
  o.ps.forEach((c,q)=>{const u=((t*70/d+o.ph+q/2)%1);c.setAttribute('cx',x1+(x2-x1)*u);c.setAttribute('cy',y1+(y2-y1)*u);c.setAttribute('opacity',o.g>.95&&opts.flow?(dim?.1:.95):0)});
  o.chip.classList.toggle('on',on&&touch);if(on&&touch)o.chip.style.transform=`translate(${(x1+x2)/2}px,${(y1+y2)/2}px) translate(-50%,-50%)`});

// ---- cámara
const cam={x:0,y:0,s:1};
function fitStep(){let a=1e9,b=1e9,c=-1e9,d=-1e9,n=0;for(let i=0;i<N;i++){if(!isOn(i))continue;const p=P[i];a=Math.min(a,p.x-p.r-30);c=Math.max(c,p.x+p.r+30);b=Math.min(b,p.y-p.r-10);d=Math.max(d,p.y+p.r+44);n++}
 if(!n)return;const vw=innerWidth,vh=innerHeight,padL=30,padR=innerWidth>820?270:30,padT=80,padB=110,w=Math.max(c-a,240),h=Math.max(d-b,160);
 const s=Math.min(1.3,(vw-padL-padR)/w,(vh-padT-padB)/h),tx=padL+((vw-padL-padR)-w*s)/2-a*s,ty=padT+((vh-padT-padB)-h*s)/2-b*s;cam.s+=(s-cam.s)*.07;cam.x+=(tx-cam.x)*.07;cam.y+=(ty-cam.y)*.07}
// ---- acciones
const wasOn=new Array(N).fill(true);const snapshot=()=>{for(let i=0;i<N;i++)wasOn[i]=isOn(i)};
function changed(spawnFrom){hlCat=hlType=-1;recount();
 for(let i=0;i<N;i++){els[i].classList.toggle('off',!isOn(i));
  if(isOn(i)&&wasOn[i]===false){const nb=adj[i].map(k=>other(k,i)).filter(j=>isOn(j)&&j!==i);const src=spawnFrom!=null?P[spawnFrom]:nb.length?{x:nb.reduce((s,j)=>s+P[j].x,0)/nb.length,y:nb.reduce((s,j)=>s+P[j].y,0)/nb.length}:{x:0,y:0};P[i].x=src.x+(Math.random()-.5)*40;P[i].y=src.y+(Math.random()-.5)*40;P[i].vx=P[i].vy=0;P[i].r=8}}
 snapshot();decorate();reheat(.8);autofit=true;ui()}
function decorate(){const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);act.sort((a,b)=>deg[b]-deg[a]);const hubs=new Set(opts.rings?act.slice(0,Math.min(4,act.length)).filter(i=>deg[i]>=4):[]);
 for(let i=0;i<N;i++){els[i].classList.toggle('hubn',hubs.has(i));degEls[i].textContent=deg[i];
  els[i].classList.toggle('sel',i===sel);els[i].classList.toggle('dim',(sel>=0&&i!==sel&&isOn(i)&&!adj[sel].some(k=>edgeOn(k)&&other(k,sel)===i))||(isOn(i)&&((hlCat>=0&&nodes[i].cat!==hlCat)||(hlType>=0&&!adj[i].some(k=>edgeOn(k)&&edges[k].type===hlType)))))}}
function ripple(i){const r=document.createElement('div');r.className='ripple';r.style.left=P[i].x+'px';r.style.top=P[i].y+'px';r.style.setProperty('--c',capas[nodes[i].cat].color);world.appendChild(r);setTimeout(()=>r.remove(),1100)}
function toggleNode(i){if(off.has(i)){off.delete(i)}else{off.add(i);if(sel===i){sel=-1;panel.classList.remove('on')}}changed()}
function pick(i){
 if(reveal&&isOn(i)){let any=false;adj[i].forEach(k=>{const o=other(k,i);if(off.has(o)){off.delete(o);any=true}});if(any)changed(i)}
 sel=i;selEdge=-1;ripple(i);showNode(i);decorate()}
function pickEdge(k){selEdge=k;sel=-1;showEdge(k);decorate()}
const row=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:'';
function showNode(i){const n=nodes[i],c=capas[n.cat].color;
 const rels=adj[i].filter(edgeOn).map(k=>{const e=edges[k],o=other(k,i);return `<li><b style="color:${tipos[e.type].color}">${tipos[e.type].name}</b> ${e.s===i?'→':'←'} ${nodes[o].short}</li>`}).join('');
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${c};border-color:${c}">${capas[n.cat].badge}</span><h3>${n.name}</h3><div style="color:var(--mut)">${n.kind} · ${n.scale} · <b style="color:var(--txt)">${deg[i]} conexiones activas</b></div>`+
 `<button class="tg" id="pOff"><i class="fa-solid fa-power-off"></i> Apagar este actor</button><dl>${row('Localización',n.loc)}${row('Rol territorial',n.role)}${row('Vulnerabilidad y poder',n.alert)}${row('Capacidades',n.actors)}${row('Control de información',n.ctrl)}${row('Georreferenciación',n.geo)}<dt>Relaciones activas (${deg[i]})</dt><dd><ul style="margin:4px 0 0;padding-left:18px">${rels}</ul></dd></dl>`;
 panel.classList.add('on');$('#pOff').onclick=()=>toggleNode(i)}
function showEdge(k){const e=edges[k],t=tipos[e.type];
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${t.color};border-color:${t.color}">${t.name.toUpperCase()}</span><h3>${nodes[e.s].short} → ${nodes[e.t].short}</h3><div style="color:var(--mut)">${e.detail}</div><dl>${row('Mecanismo causal',e.why)}${row('Asimetría de poder',e.power)}${row('Impacto en sostenibilidad',e.impact)}${row('Evidencia territorial',e.evidence)}</dl>`;panel.classList.add('on')}
// ---- interfaz: métricas, hubs, filtros y apagados
function ui(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);const ne=edges.filter((e,k)=>edgeOn(k)).length;
 const hubs=act.slice().sort((a,b)=>deg[b]-deg[a]).slice(0,5);
 const nCat=capas.map((c,ci)=>nodes.filter((n,i)=>n.cat===ci&&isOn(i)).length), tCat=capas.map((c,ci)=>nodes.filter(n=>n.cat===ci).length);
 const nTip=tipos.map((tp,ti)=>edges.filter((e,k)=>e.type===ti&&edgeOn(k)).length), tTip=tipos.map((tp,ti)=>edges.filter(e=>e.type===ti).length);

 $('#legend').innerHTML='<div id="stats"><b>'+act.length+'</b> de '+N+' actores activos<br><b>'+ne+'</b> relaciones · densidad <b>'+(act.length>1?(2*ne/(act.length*(act.length-1))).toFixed(2):'0')+'</b></div>'+
 '<h4>HUBS (MÁS CONEXIONES)</h4>'+hubs.map(i=>'<div class="hub" data-n="'+i+'"><span class="sw" style="background:'+capas[nodes[i].cat].color+'"></span>'+nodes[i].short.slice(0,24)+'<b>'+deg[i]+'</b></div>').join('')+
 '<hr><h4>CAPAS <span class="al"><a data-all="c">todas</a> · <a data-none="c">ninguna</a></span></h4>'+capas.map((c,i)=>'<div class="it '+(hiddenCat.has(i)?'off':'')+'" data-c="'+i+'" title="Clic: apagar/encender · Alt+clic: solo esta capa"><span class="sw" style="background:'+c.color+'"></span>'+c.name+'<b>'+nCat[i]+'/'+tCat[i]+'</b></div>').join('')+
 '<hr><h4>TIPOS DE RELACIÓN <span class="al"><a data-all="t">todos</a> · <a data-none="t">ninguno</a></span></h4>'+tipos.map((tp,i)=>'<div class="it '+(hiddenT.has(i)?'off':'')+'" data-t="'+i+'" title="'+tp.def+' · Alt+clic: solo este tipo"><span class="lg" style="background:'+tp.color+'"></span>'+tp.name+'<b>'+nTip[i]+'/'+tTip[i]+'</b></div>').join('')+
 '<hr><h4>LECTURA DEL GRÁFICO (interruptores)</h4>'+
 sw('size','Tamaño del círculo = conexiones activas',opts.size)+sw('rings','Anillo giratorio = los 4 hubs',opts.rings)+sw('thick','Grosor de la línea = impacto (Media 1 · Alta 2 · Severa/Crítica 3)',opts.thick)+sw('flow','Puntos en movimiento = sentido origen → destino',opts.flow);

$('#legend').addEventListener('click',ev=>{
 const o=ev.target.closest('[data-o]');if(o){opts[o.dataset.o]=!opts[o.dataset.o];changed();return}
 const al=ev.target.closest('a[data-all],a[data-none]');if(al){const isAll=al.dataset.all!=null,kind=al.dataset.all||al.dataset.none,set=kind==='c'?hiddenCat:hiddenT,n=kind==='c'?capas.length:tipos.length;set.clear();if(!isAll)for(let i=0;i<n;i++)set.add(i);changed();return}
 const h=ev.target.closest('.hub');if(h){pick(+h.dataset.n);return}
 const it=ev.target.closest('.it');if(!it)return;const isC=it.dataset.c!=null,set=isC?hiddenCat:hiddenT,k=+(isC?it.dataset.c:it.dataset.t),n=isC?capas.length:tipos.length;
 if(ev.altKey){set.clear();for(let i=0;i<n;i++)if(i!==k)set.add(i)}else{set.has(k)?set.delete(k):set.add(k)}changed()});
$('#legend').addEventListener('mouseover',ev=>{const it=ev.target.closest('.it[data-c],.it[data-t]');const c=it&&it.dataset.c!=null?+it.dataset.c:-1,tp=it&&it.dataset.t!=null?+it.dataset.t:-1;if(c!==hlCat||tp!==hlType){hlCat=c;hlType=tp;decorate()}});

$('#tray').addEventListener('click',ev=>{const b=ev.target.closest('button[data-o]');if(b){off.delete(+b.dataset.o);changed()}});
// ---- arrastrar nodos / doble clic / pan y zoom
let dragN=null,dragV=null,moved=0,lastClick=0,lastId=-1;
els.forEach((el,i)=>discs[i].addEventListener('pointerdown',ev=>{ev.stopPropagation();dragN=i;moved=0;discs[i].setPointerCapture(ev.pointerId);autofit=false;dragV={x:ev.clientX,y:ev.clientY}}));
addEventListener('pointermove',ev=>{if(dragN==null)return;moved+=Math.abs(ev.clientX-dragV.x)+Math.abs(ev.clientY-dragV.y);const p=P[dragN];p.fx=p.x+(ev.clientX-dragV.x)/cam.s;p.fy=p.y+(ev.clientY-dragV.y)/cam.s;p.x=p.fx;p.y=p.fy;dragV={x:ev.clientX,y:ev.clientY};if(moved>5)reheat(.35)});
addEventListener('pointerup',()=>{if(dragN==null)return;const i=dragN;P[i].fx=P[i].fy=null;dragN=null;
 if(moved<=5){const now=performance.now();if(lastId===i&&now-lastClick<380){toggleNode(i);lastId=-1}else{lastId=i;lastClick=now;pick(i)}}else{reheat(.3)}});
let pan=null;view.addEventListener('pointerdown',e=>{if(e.target!==view&&e.target!==world&&e.target.id!=='edges')return;pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};autofit=false;view.classList.add('drag');view.setPointerCapture(e.pointerId)});

view.addEventListener('click',e=>{if(e.target===view||e.target===world||e.target.id==='edges'){sel=-1;selEdge=-1;panel.classList.remove('on');decorate()}});
// ---- botones
const setMode=v=>{reveal=v;$('#bMode').classList.toggle('act',v);$('#bMode').innerHTML='<i class="fa-solid fa-diagram-successor"></i> Despliegue por clic: '+(v?'sí':'no')};
$('#bMode').onclick=()=>{setMode(!reveal);if(reveal){const keep=sel>=0?sel:deg.indexOf(Math.max(...deg));for(let i=0;i<N;i++){if(i!==keep)off.add(i);else off.delete(i)}changed();pick(keep)}};

for(let i=0;i<N;i++){P[i].r=P[i].tr=radius(i)}
cam.s=.5;
alpha=1;for(let k=0;k<320;k++)step();alpha=.25;untangled=false;

})();
