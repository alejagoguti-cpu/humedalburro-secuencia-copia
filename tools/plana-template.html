<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red de actores H y no H — Kennedy (plana)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--txt:#e8eefc;--mut:#8ea0c9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--txt);background:#000}
#view{position:absolute;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.hit{stroke:transparent;stroke-width:16;pointer-events:none;cursor:pointer;fill:none}
.hit.on{pointer-events:stroke}
.ln{fill:none;stroke-linecap:round;pointer-events:none}
.chip{position:absolute;left:0;top:0;padding:4px 11px;border-radius:99px;font-size:11px;white-space:nowrap;background:rgba(8,12,30,.95);border:1px solid rgba(120,150,255,.35);color:var(--txt);opacity:0;pointer-events:none;transition:opacity .3s}
.chip.on{opacity:1}
.nd{position:absolute;left:0;top:0;width:0;height:0;--r:24}
.disc{position:absolute;left:0;top:0;width:calc(var(--r)*2px);height:calc(var(--r)*2px);margin:calc(var(--r)*-1px) 0 0 calc(var(--r)*-1px);border-radius:50%;display:grid;place-items:center;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),rgba(255,255,255,.02)),#000;border:2px solid var(--c);box-shadow:0 0 16px -3px var(--c);color:var(--c);font-size:calc(var(--r)*.78px);
 transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s,background .3s}
.disc:hover{box-shadow:0 0 28px 1px var(--c)}
.nd.off .disc{opacity:0;transform:scale(.2);pointer-events:none}
.nd.sel .disc{background:var(--c);color:#000;box-shadow:0 0 36px 3px var(--c)}
.nd.dim .disc,.nd.dim .lb{opacity:.35}
.lb{position:absolute;left:0;top:calc(var(--r)*1px + 7px);transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11.5px;line-height:1.25;font-weight:500;color:var(--txt);text-shadow:0 1px 6px #000,0 0 3px #000;pointer-events:none;transition:opacity .4s,font-size .4s}
.nd.off .lb{opacity:0}
.nd.hubn .lb{font-size:13.5px;font-weight:700}
.hubring{position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed var(--c);opacity:0;pointer-events:none;transition:opacity .5s}
.nd.hubn .hubring{opacity:.9;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.deg{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--c);color:#000;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;pointer-events:none;font-family:inherit}
.ripple{position:absolute;border-radius:50%;border:2px solid var(--c);transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;pointer-events:none}
@keyframes rip{from{opacity:.9;width:40px;height:40px}to{opacity:0;width:380px;height:380px}}
header{position:absolute;left:18px;top:14px;z-index:5;max-width:min(560px,calc(100vw - 36px))}
header h1{margin:0;font-size:15px;letter-spacing:.04em;font-weight:600}
header p{margin:4px 0 0;font-size:12px;color:var(--mut)}
.btns{position:absolute;left:18px;bottom:16px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 400px)}
button{font:inherit;font-size:12px;color:var(--txt);background:rgba(10,16,40,.9);border:1px solid rgba(120,150,255,.35);border-radius:99px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#7aa2ff;background:rgba(30,50,120,.7)}
button.pri{background:linear-gradient(90deg,#1b5cff,#4aa3ff);border-color:#7aa2ff;font-weight:600}
button.act{background:rgba(74,163,255,.25);border-color:#7aa2ff}
#tray{position:absolute;left:18px;bottom:62px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:min(640px,calc(100vw - 400px));align-items:center}
#tray .t{font-size:11px;color:var(--mut);margin-right:4px}
#tray button{padding:5px 11px;font-size:11px;border-style:dashed}
#legend{position:absolute;right:18px;top:14px;z-index:5;width:230px;max-height:calc(100vh - 28px);overflow:auto;padding:12px 14px;border-radius:14px;background:rgba(6,10,28,.88);border:1px solid rgba(120,150,255,.25);font-size:11.5px}
#legend h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:600}
#legend .it{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer}
#legend .it.off{opacity:.35}
#legend .sw{width:11px;height:11px;border-radius:50%;flex:none}
#legend .lg{width:18px;height:3px;border-radius:2px;flex:none}
#legend hr{border:0;border-top:1px solid rgba(120,150,255,.2);margin:10px 0}
#legend .hub{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
#legend .hub b{margin-left:auto;color:var(--mut);font-weight:600}
#stats{margin-bottom:8px;color:var(--mut);line-height:1.5}#stats b{color:var(--txt)}
#panel{position:absolute;right:262px;bottom:16px;z-index:6;width:340px;max-width:calc(100vw - 36px);max-height:46vh;overflow:auto;padding:16px;border-radius:16px;background:rgba(6,10,28,.95);border:1px solid rgba(120,150,255,.3);display:none;font-size:12.5px;line-height:1.45}
#panel.on{display:block}
#panel h3{margin:0 0 2px;font-size:14px}
#panel .tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:2px 9px;border-radius:99px;border:1px solid;margin-bottom:8px}
#panel dt{color:var(--mut);font-size:10.5px;letter-spacing:.08em;margin-top:9px;text-transform:uppercase}
#panel dd{margin:2px 0 0}
#panel .x{position:absolute;right:10px;top:8px;padding:2px 9px}
#panel .tg{margin-top:10px}
#terr{position:absolute;inset:0;z-index:20;background:#000;display:none}#terr.on{display:block}#terr iframe{width:100%;height:100%;border:0}#terrClose{position:absolute;left:18px;bottom:16px;z-index:21}
@media(max-width:820px){#legend{display:none}.btns,#tray{max-width:calc(100vw - 36px)}#panel{right:18px}}
</style>
</head>
<body>
<header><h1>RED DE ACTORES HUMANOS Y NO HUMANOS · KENNEDY</h1><p>Red descentralizada: el tamaño de cada actor crece con sus conexiones activas. Clic: ver relaciones · doble clic: apagar/encender · arrastra para mover.</p></header>
<div id="view"><div id="world"><svg id="edges"></svg></div></div>
<aside id="legend"></aside>
<div id="panel"></div>
<div id="tray"></div>
<div id="terr"><iframe id="terrFrame" title="Territorio de Kennedy"></iframe><button id="terrClose"><i class="fa-solid fa-diagram-project"></i> Volver a la red</button></div>
<div class="btns"><button id="bMode"><i class="fa-solid fa-diagram-successor"></i> Despliegue por clic: no</button><button id="bAll"><i class="fa-solid fa-power-off"></i> Encender todos</button><button id="bFit"><i class="fa-solid fa-expand"></i> Ajustar vista</button><button id="bMat" class="pri"><i class="fa-solid fa-atom"></i> Materializar en el territorio</button></div>
<script>
/*DATA*/
(()=>{
const {capas,tipos,nodes,edges}=DATA, N=nodes.length;
const $=s=>document.querySelector(s), world=$('#world'), svg=$('#edges'), view=$('#view'), panel=$('#panel');
const NS='http://www.w3.org/2000/svg';
const wrap=s=>{if(s.length<=20)return[s];const w=s.split(' ');let best=0,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length,d=Math.abs(a-b);if(d<bd){bd=d;best=i}}return best?[w.slice(0,best).join(' '),w.slice(best).join(' ')]:[s]};
const adj=nodes.map(()=>[]);edges.forEach((e,k)=>{adj[e.s].push(k);adj[e.t].push(k)});
const other=(k,i)=>edges[k].s===i?edges[k].t:edges[k].s;
// ---- estado
const off=new Set(), hiddenCat=new Set(), hiddenT=new Set();
let sel=-1, selEdge=-1, reveal=false, alpha=1, untangled=true, autofit=true;
const isOn=i=>!off.has(i)&&!hiddenCat.has(nodes[i].cat);
const edgeOn=k=>{const e=edges[k];return isOn(e.s)&&isOn(e.t)&&!hiddenT.has(e.type)};
const deg=new Array(N).fill(0);
function recount(){deg.fill(0);edges.forEach((e,k)=>{if(edgeOn(k)){deg[e.s]++;deg[e.t]++}})}
const radius=i=>isOn(i)?Math.min(60,17+7*Math.sqrt(deg[i])):14;
// ---- nodos (DOM)
const P=nodes.map((n,i)=>{const q=DATA.pos&&DATA.pos[i];return q?{x:q.x*.8,y:q.y*.8,vx:0,vy:0,r:20,tr:20}:{x:Math.cos(i*2.4)*300,y:Math.sin(i*2.4)*300,vx:0,vy:0,r:20,tr:20}});
{let cx=0,cy=0;P.forEach(p=>{cx+=p.x;cy+=p.y});cx/=N;cy/=N;P.forEach(p=>{p.x-=cx;p.y-=cy})}
const els=nodes.map((n,i)=>{const d=document.createElement('div');d.className='nd';d.style.setProperty('--c',capas[n.cat].color);
 d.innerHTML=`<div class="disc"><div class="hubring"></div><i class="fa-solid ${n.icon}"></i><span class="deg"></span></div><div class="lb">${wrap(n.short).join('<br>')}</div>`;
 world.appendChild(d);return d});
const discs=els.map(d=>d.querySelector('.disc')), degEls=els.map(d=>d.querySelector('.deg'));
// ---- aristas (SVG) + partículas + etiquetas
const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
tipos.forEach((t,k)=>{const m=document.createElementNS(NS,'marker');m.id='ar'+k;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto');m.innerHTML=`<path d="M1,1 L8,5 L1,9" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;defs.appendChild(m)});
const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e};
const E=edges.map((e,k)=>{const col=tipos[e.type].color;
 const hit=mk('line',{class:'hit'});hit.addEventListener('click',ev=>{ev.stopPropagation();pickEdge(k)});
 const ln=mk('line',{class:'ln','stroke':col,'stroke-width':1.7,'marker-end':'url(#ar'+e.type+')'});
 const ps=[0,1].map(()=>mk('circle',{r:3.2,fill:col,opacity:0}));
 svg.appendChild(hit);svg.appendChild(ln);ps.forEach(p=>svg.appendChild(p));
 const chip=document.createElement('div');chip.className='chip';chip.textContent=tipos[e.type].name;world.appendChild(chip);
 return{hit,ln,ps,chip,g:0,ph:Math.random()}});
// ---- simulación de fuerzas (sin centro fijo: solo se recentra el conjunto)
function step(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);
 for(let i=0;i<N;i++){P[i].tr=radius(i);P[i].r+=(P[i].tr-P[i].r)*.12}
 if(alpha>.003){
  const a=alpha;
  for(let x=0;x<act.length;x++)for(let y=x+1;y<act.length;y++){const i=act[x],j=act[y],pi=P[i],pj=P[j];let dx=pj.x-pi.x,dy=pj.y-pi.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}const d=Math.sqrt(d2);
   const dd=Math.max(d,70),rep=(70000+(pi.r+pj.r)*1200)*a/(dd*dd*d);pi.vx-=dx*rep;pi.vy-=dy*rep;pj.vx+=dx*rep;pj.vy+=dy*rep;
   const mn=pi.r+pj.r+54;if(d<mn){const f=(mn-d)/d*.5*Math.min(1,a*3+.3);pi.vx-=dx*f;pi.vy-=dy*f;pj.vx+=dx*f;pj.vy+=dy*f}}
  edges.forEach((e,k)=>{if(!edgeOn(k))return;const pi=P[e.s],pj=P[e.t];const dx=pj.x-pi.x,dy=pj.y-pi.y,d=Math.hypot(dx,dy)||1,L=95+pi.r+pj.r,f=(d-L)/d*.12*a;pi.vx+=dx*f;pi.vy+=dy*f;pj.vx-=dx*f;pj.vy-=dy*f});
  let cx=0,cy=0;act.forEach(i=>{cx+=P[i].x;cy+=P[i].y});if(act.length){cx/=act.length;cy/=act.length}
  act.forEach(i=>{const p=P[i];if(p.fx!=null){p.x=p.fx;p.y=p.fy;p.vx=p.vy=0;return}p.vx=Math.max(-24,Math.min(24,(p.vx-p.x*.01*a)*.62));p.vy=Math.max(-24,Math.min(24,(p.vy-p.y*.01*a)*.62));p.x+=p.vx-cx*.05;p.y+=p.vy-cy*.05});
  alpha*=.985;
 }else if(!untangled){untangle(act);untangled=true}
 for(let i=0;i<N;i++){if(isOn(i))continue;const nb=adj[i].map(k=>other(k,i)).filter(isOn);if(nb.length){let cx=0,cy=0;nb.forEach(j=>{cx+=P[j].x;cy+=P[j].y});P[i].x+=(cx/nb.length-P[i].x)*.05;P[i].y+=(cy/nb.length-P[i].y)*.05}}
}
// ---- desenredo: al enfriarse, mover levemente los nodos para quitar cruces de flechas y flechas sobre actores
const ccw=(a,b,c)=>(c.y-a.y)*(b.x-a.x)-(b.y-a.y)*(c.x-a.x);
const segX=(a,b,c,d)=>ccw(a,b,c)*ccw(a,b,d)<0&&ccw(c,d,a)*ccw(c,d,b)<0;
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function untangle(act){
 const ae=[];edges.forEach((e,k)=>{if(edgeOn(k))ae.push(e)});
 const inc=new Map();act.forEach(i=>inc.set(i,[]));ae.forEach(e=>{inc.get(e.s).push(e);inc.get(e.t).push(e)});
 const local=i=>{let c=0;for(const e of inc.get(i)){for(const f of ae){if(f===e||f.s===e.s||f.s===e.t||f.t===e.s||f.t===e.t)continue;if(segX(P[e.s],P[e.t],P[f.s],P[f.t]))c+=1000}
   for(const n of act){if(n===e.s||n===e.t)continue;if(distSeg(P[n],P[e.s],P[e.t])<P[n].r+14)c+=1000}c+=Math.hypot(P[e.s].x-P[e.t].x,P[e.s].y-P[e.t].y)*.02}
  for(const f of ae){if(f.s===i||f.t===i)continue;if(distSeg(P[i],P[f.s],P[f.t])<P[i].r+14)c+=1000}
  for(const n of act){if(n===i)continue;if(Math.hypot(P[i].x-P[n].x,P[i].y-P[n].y)<P[i].r+P[n].r+40)c+=800}return c};
 for(let it=0;it<9000&&act.length>2;it++){const i=act[(Math.random()*act.length)|0],ox=P[i].x,oy=P[i].y,b=local(i),s=15+90*(1-it/9000);P[i].x+=(Math.random()-.5)*2*s;P[i].y+=(Math.random()-.5)*2*s;if(local(i)>b){P[i].x=ox;P[i].y=oy}}
}
function reheat(a){alpha=Math.max(alpha,a);untangled=false}
// ---- dibujo
const T0=performance.now();
function draw(now){
 step();
 const t=(now-T0)/1000;
 for(let i=0;i<N;i++){const p=P[i];els[i].style.transform=`translate(${p.x}px,${p.y}px)`;els[i].style.setProperty('--r',p.r.toFixed(1))}
 edges.forEach((e,k)=>{const o=E[k],on=edgeOn(k);o.g+=((on?1:0)-o.g)*.09;if(Math.abs((on?1:0)-o.g)<.01)o.g=on?1:0;
  const a=P[e.s],b=P[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,x1=a.x+ux*(a.r+3),y1=a.y+uy*(a.r+3),x2=b.x-ux*(b.r+5),y2=b.y-uy*(b.r+5),ex=x1+(x2-x1)*o.g,ey=y1+(y2-y1)*o.g;
  const touch=(sel>=0&&(e.s===sel||e.t===sel))||k===selEdge,dim=sel>=0&&!touch&&k!==selEdge;
  for(const l of [o.ln,o.hit]){l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',ex);l.setAttribute('y2',ey)}
  o.ln.style.opacity=o.g*(dim?.2:touch?1:.7);o.ln.setAttribute('stroke-width',touch?2.8:1.7);o.hit.classList.toggle('on',on);
  o.ps.forEach((c,q)=>{const u=((t*70/d+o.ph+q/2)%1);c.setAttribute('cx',x1+(x2-x1)*u);c.setAttribute('cy',y1+(y2-y1)*u);c.setAttribute('opacity',o.g>.95?(dim?.1:.95):0)});
  o.chip.classList.toggle('on',on&&touch);if(on&&touch)o.chip.style.transform=`translate(${(x1+x2)/2}px,${(y1+y2)/2}px) translate(-50%,-50%)`});
 if(autofit)fitStep();
 world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
 requestAnimationFrame(draw)}
// ---- cámara
const cam={x:0,y:0,s:1};
function fitStep(){let a=1e9,b=1e9,c=-1e9,d=-1e9,n=0;for(let i=0;i<N;i++){if(!isOn(i))continue;const p=P[i];a=Math.min(a,p.x-p.r-30);c=Math.max(c,p.x+p.r+30);b=Math.min(b,p.y-p.r-10);d=Math.max(d,p.y+p.r+44);n++}
 if(!n)return;const vw=innerWidth,vh=innerHeight,padL=30,padR=innerWidth>820?270:30,padT=80,padB=110,w=Math.max(c-a,240),h=Math.max(d-b,160);
 const s=Math.min(1.3,(vw-padL-padR)/w,(vh-padT-padB)/h),tx=padL+((vw-padL-padR)-w*s)/2-a*s,ty=padT+((vh-padT-padB)-h*s)/2-b*s;cam.s+=(s-cam.s)*.07;cam.x+=(tx-cam.x)*.07;cam.y+=(ty-cam.y)*.07}
// ---- acciones
const wasOn=new Array(N).fill(true);const snapshot=()=>{for(let i=0;i<N;i++)wasOn[i]=isOn(i)};
function changed(spawnFrom){recount();
 for(let i=0;i<N;i++){els[i].classList.toggle('off',!isOn(i));
  if(isOn(i)&&wasOn[i]===false){const nb=adj[i].map(k=>other(k,i)).filter(j=>isOn(j)&&j!==i);const src=spawnFrom!=null?P[spawnFrom]:nb.length?{x:nb.reduce((s,j)=>s+P[j].x,0)/nb.length,y:nb.reduce((s,j)=>s+P[j].y,0)/nb.length}:{x:0,y:0};P[i].x=src.x+(Math.random()-.5)*40;P[i].y=src.y+(Math.random()-.5)*40;P[i].vx=P[i].vy=0;P[i].r=8}}
 snapshot();decorate();reheat(.8);autofit=true;ui()}
function decorate(){const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);act.sort((a,b)=>deg[b]-deg[a]);const hubs=new Set(act.slice(0,Math.min(4,act.length)).filter(i=>deg[i]>=4));
 for(let i=0;i<N;i++){els[i].classList.toggle('hubn',hubs.has(i));degEls[i].textContent=deg[i];
  els[i].classList.toggle('sel',i===sel);els[i].classList.toggle('dim',sel>=0&&i!==sel&&isOn(i)&&!adj[sel].some(k=>edgeOn(k)&&other(k,sel)===i))}}
function ripple(i){const r=document.createElement('div');r.className='ripple';r.style.left=P[i].x+'px';r.style.top=P[i].y+'px';r.style.setProperty('--c',capas[nodes[i].cat].color);world.appendChild(r);setTimeout(()=>r.remove(),1100)}
function toggleNode(i){if(off.has(i)){off.delete(i)}else{off.add(i);if(sel===i){sel=-1;panel.classList.remove('on')}}changed()}
function pick(i){
 if(reveal&&isOn(i)){let any=false;adj[i].forEach(k=>{const o=other(k,i);if(off.has(o)){off.delete(o);any=true}});if(any)changed(i)}
 sel=i;selEdge=-1;ripple(i);showNode(i);decorate()}
function pickEdge(k){selEdge=k;sel=-1;showEdge(k);decorate()}
const row=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:'';
function showNode(i){const n=nodes[i],c=capas[n.cat].color;
 const rels=adj[i].filter(edgeOn).map(k=>{const e=edges[k],o=other(k,i);return `<li><b style="color:${tipos[e.type].color}">${tipos[e.type].name}</b> ${e.s===i?'→':'←'} ${nodes[o].short}</li>`}).join('');
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${c};border-color:${c}">${capas[n.cat].badge}</span><h3>${n.name}</h3><div style="color:var(--mut)">${n.kind} · ${n.scale} · <b style="color:var(--txt)">${deg[i]} conexiones activas</b></div>`+
 `<button class="tg" id="pOff"><i class="fa-solid fa-power-off"></i> Apagar este actor</button><dl>${row('Localización',n.loc)}${row('Rol territorial',n.role)}${row('Vulnerabilidad y poder',n.alert)}${row('Capacidades',n.actors)}${row('Control de información',n.ctrl)}${row('Georreferenciación',n.geo)}<dt>Relaciones activas (${deg[i]})</dt><dd><ul style="margin:4px 0 0;padding-left:18px">${rels}</ul></dd></dl>`;
 panel.classList.add('on');$('#pOff').onclick=()=>toggleNode(i)}
function showEdge(k){const e=edges[k],t=tipos[e.type];
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${t.color};border-color:${t.color}">${t.name.toUpperCase()}</span><h3>${nodes[e.s].short} → ${nodes[e.t].short}</h3><div style="color:var(--mut)">${e.detail}</div><dl>${row('Mecanismo causal',e.why)}${row('Asimetría de poder',e.power)}${row('Impacto en sostenibilidad',e.impact)}${row('Evidencia territorial',e.evidence)}</dl>`;panel.classList.add('on')}
// ---- interfaz: métricas, hubs, filtros y apagados
function ui(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);const ne=edges.filter((e,k)=>edgeOn(k)).length;
 const hubs=act.slice().sort((a,b)=>deg[b]-deg[a]).slice(0,5);
 $('#legend').innerHTML=`<div id="stats"><b>${act.length}</b> de ${N} actores activos<br><b>${ne}</b> relaciones · densidad <b>${act.length>1?(2*ne/(act.length*(act.length-1))).toFixed(2):'0'}</b></div>`+
 '<h4>HUBS (MÁS CONEXIONES)</h4>'+hubs.map(i=>`<div class="hub" data-n="${i}"><span class="sw" style="background:${capas[nodes[i].cat].color}"></span>${nodes[i].short.slice(0,24)}<b>${deg[i]}</b></div>`).join('')+
 '<hr><h4>CAPAS (clic para apagar)</h4>'+capas.map((c,i)=>`<div class="it ${hiddenCat.has(i)?'off':''}" data-c="${i}"><span class="sw" style="background:${c.color}"></span>${c.name}</div>`).join('')+
 '<hr><h4>TIPOS DE RELACIÓN</h4>'+tipos.map((t,i)=>`<div class="it ${hiddenT.has(i)?'off':''}" data-t="${i}"><span class="lg" style="background:${t.color}"></span>${t.name}</div>`).join('');
 const offs=[...off];$('#tray').innerHTML=offs.length?'<span class="t">Apagados:</span>'+offs.map(i=>`<button data-o="${i}"><i class="fa-solid fa-power-off"></i> ${nodes[i].short.slice(0,22)}</button>`).join(''):''}
$('#legend').addEventListener('click',ev=>{const h=ev.target.closest('.hub');if(h){pick(+h.dataset.n);return}const it=ev.target.closest('.it');if(!it)return;const set=it.dataset.c!=null?hiddenCat:hiddenT,k=+(it.dataset.c!=null?it.dataset.c:it.dataset.t);set.has(k)?set.delete(k):set.add(k);changed()});
$('#tray').addEventListener('click',ev=>{const b=ev.target.closest('button[data-o]');if(b){off.delete(+b.dataset.o);changed()}});
// ---- arrastrar nodos / doble clic / pan y zoom
let dragN=null,dragV=null,moved=0,lastClick=0,lastId=-1;
els.forEach((el,i)=>discs[i].addEventListener('pointerdown',ev=>{ev.stopPropagation();dragN=i;moved=0;discs[i].setPointerCapture(ev.pointerId);autofit=false;dragV={x:ev.clientX,y:ev.clientY}}));
addEventListener('pointermove',ev=>{if(dragN==null)return;moved+=Math.abs(ev.clientX-dragV.x)+Math.abs(ev.clientY-dragV.y);const p=P[dragN];p.fx=p.x+(ev.clientX-dragV.x)/cam.s;p.fy=p.y+(ev.clientY-dragV.y)/cam.s;p.x=p.fx;p.y=p.fy;dragV={x:ev.clientX,y:ev.clientY};if(moved>5)reheat(.35)});
addEventListener('pointerup',()=>{if(dragN==null)return;const i=dragN;P[i].fx=P[i].fy=null;dragN=null;
 if(moved<=5){const now=performance.now();if(lastId===i&&now-lastClick<380){toggleNode(i);lastId=-1}else{lastId=i;lastClick=now;pick(i)}}else{reheat(.3)}});
let pan=null;view.addEventListener('pointerdown',e=>{if(e.target!==view&&e.target!==world&&e.target.id!=='edges')return;pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};autofit=false;view.classList.add('drag');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!pan)return;cam.x=pan.cx+e.clientX-pan.x;cam.y=pan.cy+e.clientY-pan.y});
view.addEventListener('pointerup',()=>{pan=null;view.classList.remove('drag')});
view.addEventListener('wheel',e=>{e.preventDefault();autofit=false;const k=Math.exp(-e.deltaY*.0015),ns=Math.max(.15,Math.min(2.5,cam.s*k));cam.x=e.clientX-(e.clientX-cam.x)*ns/cam.s;cam.y=e.clientY-(e.clientY-cam.y)*ns/cam.s;cam.s=ns},{passive:false});
view.addEventListener('click',e=>{if(e.target===view||e.target===world||e.target.id==='edges'){sel=-1;selEdge=-1;panel.classList.remove('on');decorate()}});
// ---- botones
const setMode=v=>{reveal=v;$('#bMode').classList.toggle('act',v);$('#bMode').innerHTML='<i class="fa-solid fa-diagram-successor"></i> Despliegue por clic: '+(v?'sí':'no')};
$('#bMode').onclick=()=>{setMode(!reveal);if(reveal){const keep=sel>=0?sel:deg.indexOf(Math.max(...deg));for(let i=0;i<N;i++){if(i!==keep)off.add(i);else off.delete(i)}changed();pick(keep)}};
$('#bAll').onclick=()=>{off.clear();hiddenCat.clear();hiddenT.clear();setMode(false);changed()};
$('#bFit').onclick=()=>{autofit=true};
$('#bMat').onclick=()=>{const ids=nodes.map((n,i)=>i).filter(isOn).map(i=>nodes[i].id);$('#terrFrame').src='red-actores.html?ids='+encodeURIComponent(ids.join(','));$('#terr').classList.add('on')};
$('#terrClose').onclick=()=>{$('#terr').classList.remove('on');$('#terrFrame').removeAttribute('src')};
// ---- arranque: red completa, sin nodo central
recount();snapshot();decorate();ui();
for(let i=0;i<N;i++){P[i].r=P[i].tr=radius(i)}
cam.s=.5;
alpha=1;for(let k=0;k<320;k++)step();alpha=.25;untangled=false;
requestAnimationFrame(draw);
window.__net={P,edges,isOn,deg,off,toggleNode,step,fitStep,setAlpha:a=>{alpha=a},get alpha(){return alpha}};
})();
</script>
</body>
