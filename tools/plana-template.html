{let a=1e9,b=1e9;P.forEach((p,i)=>{a=Math.min(a,p.x-W[i]/2);b=Math.min(b,p.y-UP)});P.forEach(p=>{p.x-=a-100;p.y-=b-100})}

 if(Math.max(a.x,b.x)<r.x0||Math.min(a.x,b.x)>r.x1||Math.max(a.y,b.y)<r.y0||Math.min(a.y,b.y)>r.y1)return false;

  c+=Math.hypot(P[e.s].x-P[e.t].x,P[e.s].y-P[e.t].y)*.01}

const totalCost=()=>{let c=0;for(let i=0;i<nodes.length;i++)c+=local(i);return c};

 const T0=performance.now();for(let r=0;r<8;r++){P.forEach((p,i)=>{p.x=base[i].x;p.y=base[i].y});anneal(60000);const c=totalCost();if(c<bc){bc=c;best=P.map(p=>({x:p.x,y:p.y}))}}
 P.forEach((p,i)=>{p.x=best[i].x;p.y=best[i].y});
}
if(DATA.pos)DATA.pos.forEach((q,i)=>{P[i].x=q.x;P[i].y=q.y});
{ let cr=0;for(let a=0;a<edges.length;a++)for(let b=a+1;b<edges.length;b++){const e=edges[a],f=edges[b];if(e.s===f.s||e.s===f.t||e.t===f.s||e.t===f.t)continue;if(segX(P[e.s],P[e.t],P[f.s],P[f.t]))cr++}
 let hits=0;edges.forEach(e=>nodes.forEach((n,k)=>{if(k!==e.s&&k!==e.t&&segRect(P[e.s],P[e.t],rectOf(k,10)))hits++}));
 window.__layout={cruces:cr,flechasSobreNodos:hits,costo:Math.round(totalCost())}}
{let a=1e9,b=1e9;P.forEach((p,i)=>{a=Math.min(a,p.x-W[i]/2);b=Math.min(b,p.y-UP)});P.forEach(p=>{p.x-=a-120;p.y-=b-120})}
nodes.forEach((n,i)=>{els[i].style.left=P[i].x+'px';els[i].style.top=P[i].y+'px'});
// ---- estado
const vis=new Set(),open=new Set();let sel=-1,selEdge=-1,hidden=new Set(),hiddenT=new Set();
const start=deg.indexOf(Math.max(...deg));
function edgeGeom(i){const e=edges[i],a=P[e.s],b=P[e.t];

// salto en el cruce (si lo hay): una de las dos líneas pasa "por encima" con un pequeño arco
for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++){const e=edges[i],f=edges[j];if(e.s===f.s||e.s===f.t||e.t===f.s||e.t===f.t)continue;

 if(segX(C,D,A,B)){const k=ccw(C,D,A)/(ccw(C,D,A)-ccw(C,D,B)),X={x:A.x+k*(B.x-A.x),y:A.y+k*(B.y-A.y)},L=Math.hypot(B.x-A.x,B.y-A.y),ux=(B.x-A.x)/L,uy=(B.y-A.y)/L,r=11;

// puntas de flecha
const defs=document.createElementNS(NS,'defs');svg.prepend(defs);
tipos.forEach((t,k)=>{const m=document.createElementNS(NS,'marker');m.id='ar'+k;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto-start-reverse');m.innerHTML=`<path d="M1,1 L8,5 L1,9" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;defs.appendChild(m)});

function render(){

 const s=Math.min(1.25,(vw-padL-padR)/w,(vh-padT-padB)/h);cam.s=s;cam.x=padL+((vw-padL-padR)-w*s)/2-a*s;cam.y=padT+((vh-padT-padB)-h*s)/2-b*s;apply()}
const cam={x:0,y:0,s:1};const apply=()=>world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
function ripple(i){const r=document.createElement('div');r.className='ripple';r.style.left=P[i].x+'px';r.style.top=P[i].y+'px';r.style.setProperty('--c',capas[nodes[i].cat].color);world.appendChild(r);setTimeout(()=>r.remove(),1200)}
function pick(i){
 const fresh=[];
 if(!open.has(i)){open.add(i);adj[i].forEach(k=>{const o=edges[k].s===i?edges[k].t:edges[k].s;if(!vis.has(o)){vis.add(o);fresh.push(o)}})}
 fresh.forEach(o=>{const el=els[o];el.style.transition='none';el.style.left=P[i].x+'px';el.style.top=P[i].y+'px'});
 if(fresh.length){world.getBoundingClientRect();fresh.forEach(o=>{const el=els[o];el.offsetWidth;el.style.transition='';el.style.left=P[o].x+'px';el.style.top=P[o].y+'px'})}
 ripple(i);sel=i;selEdge=-1;showNode(i);render()}
function pickEdge(k){selEdge=k;sel=-1;showEdge(k);render()}
const row=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:'';
function showNode(i){const n=nodes[i],c=capas[n.cat].color;
 const rels=adj[i].map(k=>{const e=edges[k],o=e.s===i?e.t:e.s;return `<li><b style="color:${tipos[e.type].color}">${tipos[e.type].name}</b> ${e.s===i?'→':'←'} ${nodes[o].short}</li>`}).join('');
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${c};border-color:${c}">${capas[n.cat].badge}</span><h3>${n.name}</h3><div style="color:var(--mut)">${n.kind} · ${n.scale}</div>`+
 `<dl>${row('Localización',n.loc)}${row('Rol territorial',n.role)}${row('Vulnerabilidad y poder',n.alert)}${row('Capacidades',n.actors)}${row('Control de información',n.ctrl)}${row('Georreferenciación',n.geo)}<dt>Relaciones (${adj[i].length})</dt><dd><ul style="margin:4px 0 0;padding-left:18px">${rels}</ul></dd></dl>`;panel.classList.add('on')}
function showEdge(k){const e=edges[k],t=tipos[e.type];
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${t.color};border-color:${t.color}">${t.name.toUpperCase()}</span><h3>${nodes[e.s].short} → ${nodes[e.t].short}</h3><div style="color:var(--mut)">${e.detail}</div><dl>${row('Mecanismo causal',e.why)}${row('Asimetría de poder',e.power)}${row('Impacto en sostenibilidad',e.impact)}${row('Evidencia territorial',e.evidence)}</dl>`;panel.classList.add('on')}
// ---- leyenda con filtros
const L=$('#legend');L.innerHTML='<h4>CAPAS</h4>'+capas.map((c,i)=>`<div class="it" data-c="${i}"><span class="sw" style="background:${c.color}"></span>${c.name}</div>`).join('')+'<hr><h4>TIPOS DE RELACIÓN</h4>'+tipos.map((t,i)=>`<div class="it" data-t="${i}"><span class="ln" style="background:${t.color}"></span>${t.name}</div>`).join('');
L.addEventListener('click',ev=>{const it=ev.target.closest('.it');if(!it)return;const set=it.dataset.c!=null?hidden:hiddenT,k=+(it.dataset.c??it.dataset.t);set.has(k)?set.delete(k):set.add(k);it.classList.toggle('off',set.has(k));render()});
// ---- pan / zoom
let drag=null;view.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.edge'))return;drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};view.classList.add('drag');world.classList.add('nt');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!drag)return;cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;apply()});
view.addEventListener('pointerup',()=>{drag=null;view.classList.remove('drag');world.classList.remove('nt')});
view.addEventListener('wheel',e=>{e.preventDefault();world.classList.add('nt');const k=Math.exp(-e.deltaY*.0015),ns=Math.max(.15,Math.min(2.5,cam.s*k));cam.x=e.clientX-(e.clientX-cam.x)*ns/cam.s;cam.y=e.clientY-(e.clientY-cam.y)*ns/cam.s;cam.s=ns;apply();clearTimeout(view._t);view._t=setTimeout(()=>world.classList.remove('nt'),120)},{passive:false});
view.addEventListener('click',()=>{sel=-1;selEdge=-1;panel.classList.remove('on');render()});
$('#bAll').onclick=()=>{nodes.forEach((_,i)=>{vis.add(i);open.add(i)});render()};
$('#bReset').onclick=()=>{vis.clear();open.clear();sel=-1;selEdge=-1;panel.classList.remove('on');vis.add(start);render()};
$('#bMat').onclick=()=>{const ids=[...vis].filter(i=>!hidden.has(nodes[i].cat)).map(i=>nodes[i].id);const f=$('#terrFrame');f.src='red-actores.html?ids='+encodeURIComponent(ids.join(','));$('#terr').classList.add('on')};
$('#terrClose').onclick=()=>{$('#terr').classList.remove('on');$('#terrFrame').removeAttribute('src')};
addEventListener('resize',fit);
vis.add(start);render();
})();
</script>
</body>
</html>
