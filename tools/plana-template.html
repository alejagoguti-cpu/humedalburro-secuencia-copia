<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red de actores H y no H — Kennedy (plana)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg1:#050816;--bg2:#0a1a6b;--txt:#e8eefc;--mut:#8ea0c9;--line:#3b6dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--txt);background:var(--bg1)}
body{background:radial-gradient(ellipse at 15% 95%,#1238d8 0%,rgba(18,56,216,0) 55%),radial-gradient(ellipse at 80% 0%,#0a1a6b 0%,rgba(10,26,107,0) 60%),var(--bg1)}
#view{position:absolute;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
#world.nt{transition:none}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke-width:1.6;opacity:0;transition:opacity .6s;pointer-events:stroke;cursor:pointer}
.edge.on{opacity:.75}.edge.hot{opacity:1;stroke-width:2.6}
.edge.dim{opacity:.18}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.chip{position:absolute;transform:translate(-50%,-50%) scale(.8);padding:4px 11px;border-radius:99px;font-size:11px;white-space:nowrap;background:rgba(10,18,50,.92);border:1px solid rgba(120,150,255,.35);color:var(--txt);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
.chip.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.node{position:absolute;display:flex;align-items:center;gap:10px;height:48px;padding:0 20px 0 6px;border-radius:99px;cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(8,14,44,.92);border:1.5px solid var(--c);
 box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 18px -4px var(--c);opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none;
 transition:opacity .55s,transform .55s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s,background .3s}
.node.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.node:hover{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 26px 0 var(--c)}
.node.sel{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));color:#04112e;box-shadow:0 0 34px 2px var(--c)}
.node.sel .ic{background:rgba(4,17,46,.85);color:#fff;border-color:transparent}
.node.show.dim{opacity:.38}
.node .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--c);border:1.5px solid var(--c);background:rgba(255,255,255,.05)}
.node .lb{white-space:nowrap;font-size:12.5px;line-height:1.2;font-weight:500;max-width:170px}
.node .more{position:absolute;right:-6px;top:-8px;min-width:20px;height:20px;border-radius:99px;background:var(--c);color:#04112e;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.node.open .more{display:none}
header{position:absolute;left:18px;top:14px;z-index:5;max-width:min(520px,calc(100vw - 36px))}
header h1{margin:0;font-size:15px;letter-spacing:.04em;font-weight:600}
header p{margin:4px 0 0;font-size:12px;color:var(--mut)}
.btns{position:absolute;left:18px;bottom:16px;z-index:5;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:12px;color:var(--txt);background:rgba(10,18,50,.85);border:1px solid rgba(120,150,255,.35);border-radius:99px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:#7aa2ff;background:rgba(30,50,120,.7)}
#legend{position:absolute;right:18px;top:14px;z-index:5;width:210px;padding:12px 14px;border-radius:14px;background:rgba(8,14,44,.82);border:1px solid rgba(120,150,255,.25);backdrop-filter:blur(8px);font-size:11.5px}
#legend h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:600}
#legend .it{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;opacity:1}
#legend .it.off{opacity:.35}
#legend .sw{width:11px;height:11px;border-radius:50%;flex:none}
#legend .ln{width:18px;height:3px;border-radius:2px;flex:none}
#legend hr{border:0;border-top:1px solid rgba(120,150,255,.2);margin:10px 0}
#panel{position:absolute;right:18px;bottom:16px;z-index:6;width:340px;max-width:calc(100vw - 36px);max-height:52vh;overflow:auto;padding:16px;border-radius:16px;background:rgba(8,14,44,.94);border:1px solid rgba(120,150,255,.3);backdrop-filter:blur(10px);display:none;font-size:12.5px;line-height:1.45}
#panel.on{display:block}
#panel h3{margin:0 0 2px;font-size:14px}
#panel .tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:2px 9px;border-radius:99px;border:1px solid;margin-bottom:8px}
#panel dt{color:var(--mut);font-size:10.5px;letter-spacing:.08em;margin-top:9px;text-transform:uppercase}
#panel dd{margin:2px 0 0}
#panel .x{position:absolute;right:10px;top:8px;padding:2px 9px}
#hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;font-size:12px;color:var(--mut);padding:7px 14px;border-radius:99px;background:rgba(8,14,44,.7);border:1px solid rgba(120,150,255,.2);transition:opacity .5s;pointer-events:none}
#terr{position:absolute;inset:0;z-index:20;background:#050816;display:none}#terr.on{display:block}#terr iframe{width:100%;height:100%;border:0}#terrClose{position:absolute;left:18px;bottom:16px;z-index:21}button.pri{background:linear-gradient(90deg,#1b5cff,#4aa3ff);border-color:#7aa2ff;font-weight:600}
@media(max-width:820px){#legend{display:none}#hint{display:none}}
</style>
</head>
<body>
<header><h1>RED DE ACTORES HUMANOS Y NO HUMANOS · KENNEDY</h1><p>Haz clic en un actor para desplegar con quién se relaciona. Cuando quieras, pulsa Materializar para ver esos actores en el territorio.</p></header>
<div id="hint">Pulsa el actor para abrir sus conexiones</div>
<div id="view"><div id="world"><svg id="edges"></svg></div></div>
<aside id="legend"></aside>
<div id="panel"></div>
<div id="terr"><iframe id="terrFrame" title="Territorio de Kennedy"></iframe><button id="terrClose"><i class="fa-solid fa-diagram-project"></i> Volver a la red</button></div>
<div class="btns"><button id="bAll"><i class="fa-solid fa-expand"></i> Mostrar toda la red</button><button id="bReset"><i class="fa-solid fa-rotate-left"></i> Reiniciar</button><button id="bMat" class="pri"><i class="fa-solid fa-atom"></i> Materializar en el territorio</button></div>
<script>
/*DATA*/
(()=>{
const {capas,tipos,nodes,edges}=DATA;
const $=s=>document.querySelector(s), world=$('#world'), svg=$('#edges'), view=$('#view'), panel=$('#panel');
const NS='http://www.w3.org/2000/svg';
const wrap=s=>{if(s.length<=20)return[s];const w=s.split(' ');let best=0,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length,d=Math.abs(a-b);if(d<bd){bd=d;best=i}}return best?[w.slice(0,best).join(' '),w.slice(best).join(' ')]:[s]};
const deg=nodes.map(()=>0);edges.forEach(e=>{deg[e.s]++;deg[e.t]++});
const adj=nodes.map(()=>[]);edges.forEach((e,i)=>{adj[e.s].push(i);adj[e.t].push(i)});
// ---- elementos de nodo
const els=nodes.map((n,i)=>{const d=document.createElement('div');d.className='node';d.style.setProperty('--c',capas[n.cat].color);
 d.innerHTML=`<span class="ic"><i class="fa-solid ${n.icon}"></i></span><span class="lb">${wrap(n.short).join('<br>')}</span><span class="more"></span>`;
 d.addEventListener('click',ev=>{ev.stopPropagation();pick(i)});world.appendChild(d);return d});
const chips=edges.map(e=>{const c=document.createElement('div');c.className='chip';c.textContent=tipos[e.type].name;world.appendChild(c);return c});
const paths=edges.map((e,i)=>{const p=document.createElementNS(NS,'path');p.setAttribute('class','edge');p.style.stroke=tipos[e.type].color;
 p.addEventListener('click',ev=>{ev.stopPropagation();pickEdge(i)});svg.appendChild(p);return p});
// ---- tamaños y layout (fuerza 2D con colisión de rectángulos)
const W=nodes.map((n,i)=>{const l=wrap(n.short);return 78+Math.max(...l.map(s=>s.length))*6.4}), H=54;
let seed=7;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const P=nodes.map((n,i)=>{const a=rnd()*6.283,r=200+rnd()*500;return{x:Math.cos(a)*r*1.5,y:Math.sin(a)*r}});
// capas agrupadas en sectores para legibilidad
nodes.forEach((n,i)=>{const a=(n.cat/capas.length)*6.283+rnd()*.8;P[i].x=Math.cos(a)*520*1.5+(rnd()-.5)*200;P[i].y=Math.sin(a)*520+(rnd()-.5)*200});
for(let it=0;it<900;it++){const t=1-it/900,F=P.map(()=>({x:0,y:0}));
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){let dx=P[i].x-P[j].x,dy=P[i].y-P[j].y;const ox=(W[i]+W[j])/2+40-Math.abs(dx),oy=H+46-Math.abs(dy);
  const d=Math.hypot(dx,dy)||1;let f=90000/(d*d);if(ox>0&&oy>0)f+=(Math.min(ox,oy*1.8))*1.4;F[i].x+=dx/d*f;F[i].y+=dy/d*f;F[j].x-=dx/d*f;F[j].y-=dy/d*f}
 edges.forEach(e=>{const dx=P[e.t].x-P[e.s].x,dy=P[e.t].y-P[e.s].y,d=Math.hypot(dx,dy)||1,f=(d-300)*.012;F[e.s].x+=dx/d*f*d*.05;F[e.s].y+=dy/d*f*d*.05;F[e.t].x-=dx/d*f*d*.05;F[e.t].y-=dy/d*f*d*.05});
 P.forEach((p,i)=>{F[i].x-=p.x*.004;F[i].y-=p.y*.006;const l=Math.hypot(F[i].x,F[i].y)||1,m=Math.min(l,30*t+1.5);p.x+=F[i].x/l*m;p.y+=F[i].y/l*m})}
let x0=1e9,y0=1e9;P.forEach((p,i)=>{x0=Math.min(x0,p.x-W[i]/2);y0=Math.min(y0,p.y-H)});
P.forEach(p=>{p.x-=x0-120;p.y-=y0-120});
nodes.forEach((n,i)=>{els[i].style.left=P[i].x+'px';els[i].style.top=P[i].y+'px'});
// ---- estado
const vis=new Set(),open=new Set();let sel=-1,selEdge=-1,hidden=new Set(),hiddenT=new Set();
const start=deg.indexOf(Math.max(...deg));
function edgeGeom(i){const e=edges[i],a=P[e.s],b=P[e.t];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const bend=Math.min(60,d*.16)*(e.s<e.t?1:-1),mx=(a.x+b.x)/2-dy/d*bend,my=(a.y+b.y)/2+dx/d*bend;
 const clip=(n,p,tx,ty)=>{const vx=tx-p.x,vy=ty-p.y,hw=W[n]/2+6,hh=H/2+4,k=Math.min(hw/(Math.abs(vx)||1e-6),hh/(Math.abs(vy)||1e-6));return{x:p.x+vx*Math.min(k,1),y:p.y+vy*Math.min(k,1)}};
 const A=clip(e.s,a,mx,my),B=clip(e.t,b,mx,my);return{d:`M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}`,mx:(A.x+2*mx+B.x)/4,my:(A.y+2*my+B.y)/4,A,B,m:{x:mx,y:my}}}
const G=edges.map((_,i)=>edgeGeom(i));
paths.forEach((p,i)=>p.setAttribute('d',G[i].d));
// puntas de flecha
const defs=document.createElementNS(NS,'defs');svg.prepend(defs);
tipos.forEach((t,k)=>{const m=document.createElementNS(NS,'marker');m.id='ar'+k;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto-start-reverse');m.innerHTML=`<path d="M1,1 L8,5 L1,9" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;defs.appendChild(m)});
paths.forEach((p,i)=>p.setAttribute('marker-end',`url(#ar${edges[i].type})`));
chips.forEach((c,i)=>{c.style.left=G[i].mx+'px';c.style.top=G[i].my+'px'});
function edgeVisible(i){const e=edges[i];return vis.has(e.s)&&vis.has(e.t)&&(open.has(e.s)||open.has(e.t))&&!hidden.has(nodes[e.s].cat)&&!hidden.has(nodes[e.t].cat)&&!hiddenT.has(e.type)}
function render(){
 nodes.forEach((n,i)=>{const on=vis.has(i)&&!hidden.has(n.cat);els[i].classList.toggle('show',on);els[i].classList.toggle('sel',i===sel);els[i].classList.toggle('open',open.has(i));
  const rest=adj[i].filter(k=>{const o=edges[k].s===i?edges[k].t:edges[k].s;return !vis.has(o)}).length;els[i].querySelector('.more').textContent='+'+rest;els[i].querySelector('.more').style.display=rest&&!open.has(i)?'grid':'none';
  els[i].classList.toggle('dim',sel>=0&&i!==sel&&!adj[sel].some(k=>edges[k].s===i||edges[k].t===i))});
 edges.forEach((e,i)=>{const on=edgeVisible(i),touch=sel>=0&&(e.s===sel||e.t===sel)||i===selEdge;paths[i].classList.toggle('on',on);paths[i].classList.toggle('hot',on&&touch);paths[i].classList.toggle('dim',on&&sel>=0&&!touch&&i!==selEdge);
  paths[i].style.pointerEvents=on?'stroke':'none';chips[i].classList.toggle('on',on&&touch)});
 $('#hint').style.opacity=vis.size>1?0:1;fit()}
function fit(){const ids=[...vis].filter(i=>!hidden.has(nodes[i].cat));if(!ids.length)return;let a=1e9,b=1e9,c=-1e9,d=-1e9;
 ids.forEach(i=>{a=Math.min(a,P[i].x-W[i]/2);c=Math.max(c,P[i].x+W[i]/2);b=Math.min(b,P[i].y-H/2);d=Math.max(d,P[i].y+H/2)});
 const vw=innerWidth,vh=innerHeight,padL=40,padR=innerWidth>820?250:40,padT=90,padB=90,w=Math.max(c-a,260),h=Math.max(d-b,120);
 const s=Math.min(1.25,(vw-padL-padR)/w,(vh-padT-padB)/h);cam.s=s;cam.x=padL+((vw-padL-padR)-w*s)/2-a*s;cam.y=padT+((vh-padT-padB)-h*s)/2-b*s;apply()}
const cam={x:0,y:0,s:1};const apply=()=>world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
function pick(i){
 if(!open.has(i)){open.add(i);adj[i].forEach(k=>{const o=edges[k].s===i?edges[k].t:edges[k].s;vis.add(o)})}
 sel=i;selEdge=-1;showNode(i);render()}
function pickEdge(k){selEdge=k;sel=-1;showEdge(k);render()}
const row=(t,v)=>v?`<dt>${t}</dt><dd>${v}</dd>`:'';
function showNode(i){const n=nodes[i],c=capas[n.cat].color;
 const rels=adj[i].map(k=>{const e=edges[k],o=e.s===i?e.t:e.s;return `<li><b style="color:${tipos[e.type].color}">${tipos[e.type].name}</b> ${e.s===i?'→':'←'} ${nodes[o].short}</li>`}).join('');
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${c};border-color:${c}">${capas[n.cat].badge}</span><h3>${n.name}</h3><div style="color:var(--mut)">${n.kind} · ${n.scale}</div>`+
 `<dl>${row('Localización',n.loc)}${row('Rol territorial',n.role)}${row('Vulnerabilidad y poder',n.alert)}${row('Capacidades',n.actors)}${row('Control de información',n.ctrl)}${row('Georreferenciación',n.geo)}<dt>Relaciones (${adj[i].length})</dt><dd><ul style="margin:4px 0 0;padding-left:18px">${rels}</ul></dd></dl>`;panel.classList.add('on')}
function showEdge(k){const e=edges[k],t=tipos[e.type];
 panel.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('on')">✕</button><span class="tag" style="color:${t.color};border-color:${t.color}">${t.name.toUpperCase()}</span><h3>${nodes[e.s].short} → ${nodes[e.t].short}</h3><div style="color:var(--mut)">${e.detail}</div><dl>${row('Mecanismo causal',e.why)}${row('Asimetría de poder',e.power)}${row('Impacto en sostenibilidad',e.impact)}${row('Evidencia territorial',e.evidence)}</dl>`;panel.classList.add('on')}
// ---- leyenda con filtros
const L=$('#legend');L.innerHTML='<h4>CAPAS</h4>'+capas.map((c,i)=>`<div class="it" data-c="${i}"><span class="sw" style="background:${c.color}"></span>${c.name}</div>`).join('')+'<hr><h4>TIPOS DE RELACIÓN</h4>'+tipos.map((t,i)=>`<div class="it" data-t="${i}"><span class="ln" style="background:${t.color}"></span>${t.name}</div>`).join('');
L.addEventListener('click',ev=>{const it=ev.target.closest('.it');if(!it)return;const set=it.dataset.c!=null?hidden:hiddenT,k=+(it.dataset.c??it.dataset.t);set.has(k)?set.delete(k):set.add(k);it.classList.toggle('off',set.has(k));render()});
// ---- pan / zoom
let drag=null;view.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.edge'))return;drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};view.classList.add('drag');world.classList.add('nt');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!drag)return;cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;apply()});
view.addEventListener('pointerup',()=>{drag=null;view.classList.remove('drag');world.classList.remove('nt')});
view.addEventListener('wheel',e=>{e.preventDefault();world.classList.add('nt');const k=Math.exp(-e.deltaY*.0015),ns=Math.max(.15,Math.min(2.5,cam.s*k));cam.x=e.clientX-(e.clientX-cam.x)*ns/cam.s;cam.y=e.clientY-(e.clientY-cam.y)*ns/cam.s;cam.s=ns;apply();clearTimeout(view._t);view._t=setTimeout(()=>world.classList.remove('nt'),120)},{passive:false});
view.addEventListener('click',()=>{sel=-1;selEdge=-1;panel.classList.remove('on');render()});
$('#bAll').onclick=()=>{nodes.forEach((_,i)=>{vis.add(i);open.add(i)});render()};
$('#bReset').onclick=()=>{vis.clear();open.clear();sel=-1;selEdge=-1;panel.classList.remove('on');vis.add(start);render()};
$('#bMat').onclick=()=>{const ids=[...vis].filter(i=>!hidden.has(nodes[i].cat)).map(i=>nodes[i].id);const f=$('#terrFrame');f.src='red-actores.html?ids='+encodeURIComponent(ids.join(','));$('#terr').classList.add('on')};
$('#terrClose').onclick=()=>{$('#terr').classList.remove('on');$('#terrFrame').removeAttribute('src')};
addEventListener('resize',fit);
vis.add(start);render();
})();
</script>
</body>
</html>
