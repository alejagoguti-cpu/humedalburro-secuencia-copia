<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red de actores H y no H — Kennedy (plana)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--txt:#f1f4ff;--mut:#8b95b0;--line:rgba(255,255,255,.1);--glass:rgba(14,16,26,.82);--acc:#5b9dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,"Segoe UI",sans-serif;color:var(--txt);background:#000;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- lienzo ---------- */
#view{position:absolute;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.hit{stroke:transparent;stroke-width:16;pointer-events:none;cursor:pointer;fill:none}
.hit.on{pointer-events:stroke}
.ln{fill:none;stroke-linecap:round;pointer-events:none}
.chip{position:absolute;left:0;top:0;padding:3px 10px;border-radius:99px;font-size:11px;white-space:nowrap;background:#0b0d16;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .25s}
.chip.on{opacity:1}
.nd{position:absolute;left:0;top:0;width:0;height:0;--r:24}
.disc{position:absolute;left:0;top:0;width:calc(var(--r)*2px);height:calc(var(--r)*2px);margin:calc(var(--r)*-1px) 0 0 calc(var(--r)*-1px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6%;text-align:center;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(255,255,255,.02)),#000;border:2px solid var(--c);box-shadow:0 0 14px -4px var(--c);color:var(--c);
 transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.3,1.2),box-shadow .25s,background .25s}
.disc>i{font-size:calc(var(--r)*.3px);line-height:1;opacity:.9}
.tx{color:var(--txt);font-weight:600;font-size:clamp(9.5px,calc(var(--r)*.19px + 3px),14px);line-height:1.12;max-width:calc(var(--r)*1.62px);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere;hyphens:auto;pointer-events:none}
.nd.sel .tx{color:#04122e}
.disc:hover{box-shadow:0 0 26px 0 var(--c)}
.nd.off .disc{opacity:0;transform:scale(.2);pointer-events:none}
.nd.sel .disc{background:var(--c);color:#000;box-shadow:0 0 34px 3px var(--c)}
.nd.dim .disc{opacity:.28}
.lb{position:absolute;left:0;top:calc(var(--r)*1px + 6px);transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11.5px;line-height:1.25;font-weight:500;color:var(--txt);text-shadow:0 1px 5px #000,0 0 3px #000;pointer-events:none;opacity:0;transition:opacity .3s}
.nd.lab .lb{opacity:1}
.nd.hubn .lb{font-size:13px;font-weight:700}
.nd.dim .lb{opacity:0}
.nd.off .lb{opacity:0}
.hubring{position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--c);opacity:0;pointer-events:none;transition:opacity .4s}
.nd.hubn .hubring{opacity:.85;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.deg{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;border-radius:99px;background:var(--c);color:#000;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;font-family:inherit;pointer-events:none}
.nd.hubn .deg,.nd.sel .deg,.nd.hov .deg{display:grid}
.ripple{position:absolute;border-radius:50%;border:2px solid var(--c);transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;pointer-events:none}
@keyframes rip{from{opacity:.8;width:40px;height:40px}to{opacity:0;width:360px;height:360px}}
/* ---------- interfaz ---------- */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.btn.on{background:rgba(91,157,255,.22);border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04122e;font-weight:600}
.btn.pri:hover{background:#7bb0ff}
.btn.ico{width:32px;padding:0;justify-content:center}
#top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 20px;pointer-events:none}
#top>*{pointer-events:auto}
#brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
#brand p{margin:3px 0 0;color:var(--mut);font-size:12px}
#hubs{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:nowrap}
#hubs .k{font-size:11px;color:var(--mut);margin-right:2px;letter-spacing:.05em}
.hubchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;cursor:pointer;max-width:176px;flex:none}
.hubchip:hover{background:rgba(255,255,255,.1)}
.hubchip i{width:9px;height:9px;border-radius:50%;flex:none}
.hubchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubchip b{color:var(--mut);font-weight:600}
#search{position:relative;width:280px}
#search input{width:100%;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--txt);padding:0 14px 0 34px;font:inherit;font-size:12.5px;outline:none}
#search input:focus{border-color:var(--acc)}
#search>i{position:absolute;left:13px;top:10px;color:var(--mut);font-size:12px}
#results{position:absolute;left:0;right:0;top:40px;border-radius:12px;overflow:hidden;display:none}
#results.on{display:block}
#results div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px}
#results div:hover,#results div.cur{background:rgba(255,255,255,.1)}
#results i{width:9px;height:9px;border-radius:50%;flex:none}
#results small{margin-left:auto;color:var(--mut)}
#actions{display:flex;align-items:center;gap:10px}
#stat{color:var(--mut);font-size:12px;white-space:nowrap}#stat b{color:var(--txt);font-weight:600}
/* barra inferior */
#dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;width:min(960px,calc(100vw - 32px));border-radius:16px;padding:12px 14px;display:grid;gap:9px}
#dock .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#dock .row>.k{width:78px;flex:none;font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.fchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;cursor:pointer;user-select:none;transition:opacity .15s,background .15s}
.fchip:hover{background:rgba(255,255,255,.1)}
.fchip i{width:9px;height:9px;border-radius:50%;flex:none}
.fchip i.l{width:14px;height:3px;border-radius:2px}
.fchip b{color:var(--mut);font-weight:600;font-size:11px}
.fchip.off{opacity:.4;text-decoration:line-through}
.fchip.off b{text-decoration:none}
#dock .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
#dock .tools .sp{flex:1}
#dock .hintx{font-size:11.5px;color:var(--mut)}
#offrow{position:absolute;left:50%;bottom:calc(var(--dockh,170px) + 28px);transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-radius:14px;max-width:min(760px,calc(100vw - 32px))}
#offrow.on{display:flex}
#offrow .k{font-size:11px;color:var(--mut);margin-right:4px}
#offrow .fchip{border-style:dashed}
#pop{position:absolute;z-index:7;width:280px;border-radius:14px;padding:6px;display:none}
#pop.on{display:block}
#pop .opt{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer}
#pop .opt:hover{background:rgba(255,255,255,.07)}
#pop .tgl{margin-top:2px;width:30px;height:17px;border-radius:99px;background:#2a2f40;position:relative;flex:none;transition:background .2s}
#pop .tgl::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
#pop .opt.on .tgl{background:var(--acc)}#pop .opt.on .tgl::after{transform:translateX(13px)}
#pop .opt b{display:block;font-weight:600;font-size:12.5px}#pop .opt span{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.35}
/* ficha */
#drawer{position:absolute;right:20px;top:76px;bottom:calc(var(--dockh,170px) + 36px);width:340px;z-index:6;border-radius:16px;display:none;flex-direction:column;overflow:hidden}
#drawer.on{display:flex}
#drawer .hd{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
#drawer .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;font-weight:600;color:var(--c)}
#drawer .tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#drawer h3{margin:6px 28px 4px 0;font-size:15px;line-height:1.3}
#drawer .sub{color:var(--mut);font-size:12px}
#drawer .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.07)}
#drawer .x:hover{background:rgba(255,255,255,.16)}
#drawer .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#drawer .bd{padding:6px 18px 18px;overflow:auto;flex:1}
#drawer .sec{margin-top:14px}
#drawer .sec h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;font-weight:600}
#drawer .sec p{margin:0;line-height:1.5;font-size:12.5px}
#drawer .rel{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 -8px;border-radius:9px;cursor:pointer}
#drawer .rel:hover{background:rgba(255,255,255,.07)}
#drawer .rel i{width:3px;align-self:stretch;border-radius:2px;flex:none}
#drawer .rel div{line-height:1.3}#drawer .rel small{display:block;color:var(--mut);font-size:11px}
#drawer .kpi{display:flex;gap:18px;margin-top:10px}#drawer .kpi div{font-size:11px;color:var(--mut)}#drawer .kpi b{display:block;font-size:18px;color:var(--txt);font-weight:650}
#terr{position:absolute;inset:0;z-index:20;background:#000;display:none}#terr.on{display:block}#terr iframe{width:100%;height:100%;border:0}#terrClose{position:absolute;left:20px;bottom:20px;z-index:21}
@media(max-width:860px){
 #top{flex-wrap:wrap;padding:12px}#search{width:100%;order:3}#stat{display:none}
 #dock{bottom:10px;padding:10px;width:calc(100vw - 20px);gap:7px}#dock .row,#dock .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#dock .row::-webkit-scrollbar,#dock .tools::-webkit-scrollbar{display:none}#dock .row>.k{width:auto}#dock .fchip,#dock .btn{flex:none}#dock .hintx,#dock .sp{display:none}#brand{max-width:100%}#hubs{overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 24px)}
 #drawer{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--dockh,170px) + 20px);max-height:46vh}
}
</style>
</head>
<body>
<div id="view"><div id="world"><svg id="edges"></svg></div></div>
<div id="top">
 <div id="brand"><h1>Red de actores · Kennedy</h1><p>Humanos y no humanos · Corte II</p><div id="hubs"></div></div>
 <div id="search" class="glass" style="border-radius:99px;border:0;background:none;backdrop-filter:none"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Buscar un actor…" autocomplete="off"><div id="results" class="glass"></div></div>
 <div id="actions"><span id="stat"></span><button class="btn pri" id="bMat"><i class="fa-solid fa-atom"></i> Ver en el territorio</button></div>
</div>
<div id="drawer" class="glass"></div>
<div id="offrow" class="glass"></div>
<div id="dock" class="glass">
 <div class="row"><span class="k">Capas</span><span id="chCap" style="display:contents"></span></div>
 <div class="row"><span class="k">Relaciones</span><span id="chTip" style="display:contents"></span></div>
 <div class="tools">
  <button class="btn" id="bMode" title="Empieza con un solo actor y cada clic activa a sus vecinos"><i class="fa-solid fa-diagram-successor"></i> Desplegar por clic</button>
  <button class="btn" id="bView"><i class="fa-solid fa-sliders"></i> Cómo leer el gráfico</button>
  <button class="btn" id="bFit"><i class="fa-solid fa-expand"></i> Centrar</button>
  <button class="btn" id="bAll"><i class="fa-solid fa-rotate-left"></i> Restablecer</button>
  <span class="sp"></span><span class="hintx">Doble clic apaga un actor · Alt+clic aísla un grupo</span>
 </div>
</div>
<div id="pop" class="glass"></div>
<div id="terr"><iframe id="terrFrame" title="Territorio de Kennedy"></iframe><button class="btn pri" id="terrClose"><i class="fa-solid fa-diagram-project"></i> Volver a la red</button></div>
<script>
/*DATA*/
(()=>{
const {capas,tipos,nodes,edges}=DATA, N=nodes.length;
const $=s=>document.querySelector(s), world=$('#world'), svg=$('#edges'), view=$('#view'), drawer=$('#drawer');
const NS='http://www.w3.org/2000/svg';
const abbr=s=>{const x=s.replace(/s*(.*?)/g,'').replace(/^Flora Nativa Hub: /,'Flora: ').replace(/(de|del|la|las|los|el|y|e|en|con)s+/gi,'').trim();return x.length>34?x.slice(0,33).replace(/s+S*$/,'')+'…':x};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const wrap=s=>{if(s.length<=20)return[s];const w=s.split(' ');let best=0,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length,d=Math.abs(a-b);if(d<bd){bd=d;best=i}}return best?[w.slice(0,best).join(' '),w.slice(best).join(' ')]:[s]};
const adj=nodes.map(()=>[]);edges.forEach((e,k)=>{adj[e.s].push(k);adj[e.t].push(k)});
const other=(k,i)=>edges[k].s===i?edges[k].t:edges[k].s;
const shortCap=c=>c.badge.charAt(0)+c.badge.slice(1).toLowerCase(), shortTip=t=>t.name.split(' ')[0];
// ---- estado
const off=new Set(), hiddenCat=new Set(), hiddenT=new Set();
const opts={size:true,thick:true,flow:true,rings:true};
let sel=-1, selEdge=-1, hover=-1, hoverEdge=-1, hlCat=-1, hlType=-1, reveal=false, alpha=1, untangled=true, autofit=true;
const isOn=i=>!off.has(i)&&!hiddenCat.has(nodes[i].cat);
const edgeOn=k=>{const e=edges[k];return isOn(e.s)&&isOn(e.t)&&!hiddenT.has(e.type)};
const deg=new Array(N).fill(0);
function recount(){deg.fill(0);edges.forEach((e,k)=>{if(edgeOn(k)){deg[e.s]++;deg[e.t]++}})}
const radius=i=>isOn(i)?(opts.size?Math.min(78,36+7*Math.sqrt(deg[i])):44):14;
// ---- nodos
const P=nodes.map((n,i)=>{const q=DATA.pos&&DATA.pos[i];return q?{x:q.x*.8,y:q.y*.8,vx:0,vy:0,r:20,tr:20}:{x:Math.cos(i*2.4)*300,y:Math.sin(i*2.4)*300,vx:0,vy:0,r:20,tr:20}});
{let cx=0,cy=0;P.forEach(p=>{cx+=p.x;cy+=p.y});cx/=N;cy/=N;P.forEach(p=>{p.x-=cx;p.y-=cy})}
const els=nodes.map((n,i)=>{const d=document.createElement('div');d.className='nd';d.style.setProperty('--c',capas[n.cat].color);
 d.innerHTML=`<div class="disc" title="${n.name.replace(/"/g,'')}"><div class="hubring"></div><i class="fa-solid ${n.icon}"></i><span class="tx">${abbr(n.name)}</span><span class="deg"></span></div>`;
 world.appendChild(d);return d});
const discs=els.map(d=>d.querySelector('.disc')), degEls=els.map(d=>d.querySelector('.deg'));
// ---- aristas
const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
tipos.forEach((t,k)=>{const m=document.createElementNS(NS,'marker');m.id='ar'+k;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','6');m.setAttribute('markerHeight','6');m.setAttribute('orient','auto');m.innerHTML=`<path d="M1,1 L8,5 L1,9" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;defs.appendChild(m)});
const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e};
const E=edges.map((e,k)=>{const col=tipos[e.type].color;
 const hit=mk('line',{class:'hit'});hit.addEventListener('click',ev=>{ev.stopPropagation();pickEdge(k)});hit.addEventListener('mouseenter',()=>{hoverEdge=k});hit.addEventListener('mouseleave',()=>{if(hoverEdge===k)hoverEdge=-1});
 const ln=mk('line',{class:'ln','stroke':col,'stroke-width':1.7,'marker-end':'url(#ar'+e.type+')'});
 const ps=[0,1].map(()=>mk('circle',{r:3,fill:col,opacity:0}));
 svg.appendChild(hit);svg.appendChild(ln);ps.forEach(p=>svg.appendChild(p));
 const chip=document.createElement('div');chip.className='chip';chip.textContent=tipos[e.type].name;chip.style.color=col;world.appendChild(chip);
 return{hit,ln,ps,chip,g:0,ph:Math.random()}});
// ---- simulación de fuerzas (sin centro fijo)
const gyk=()=>{const asp=(innerWidth-(drawer.classList.contains('on')?400:60))/Math.max(300,innerHeight-(window.__dockH||170)-130);return Math.min(3.2,Math.max(1,asp*.95))};
function step(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);
 for(let i=0;i<N;i++){P[i].tr=radius(i);P[i].r+=(P[i].tr-P[i].r)*.12}
 if(alpha>.003){
  const a=alpha;
  for(let x=0;x<act.length;x++)for(let y=x+1;y<act.length;y++){const i=act[x],j=act[y],pi=P[i],pj=P[j];let dx=pj.x-pi.x,dy=pj.y-pi.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}const d=Math.sqrt(d2);
   const dd=Math.max(d,70),rep=(70000+(pi.r+pj.r)*1200)*a/(dd*dd*d);pi.vx-=dx*rep;pi.vy-=dy*rep;pj.vx+=dx*rep;pj.vy+=dy*rep;
   const mn=pi.r+pj.r+46;if(d<mn){const f=(mn-d)/d*.5*Math.min(1,a*3+.3);pi.vx-=dx*f;pi.vy-=dy*f;pj.vx+=dx*f;pj.vy+=dy*f}}
  edges.forEach((e,k)=>{if(!edgeOn(k))return;const pi=P[e.s],pj=P[e.t];const dx=pj.x-pi.x,dy=pj.y-pi.y,d=Math.hypot(dx,dy)||1,L=70+pi.r+pj.r,f=(d-L)/d*.12*a;pi.vx+=dx*f;pi.vy+=dy*f;pj.vx-=dx*f;pj.vy-=dy*f});
  let cx=0,cy=0;act.forEach(i=>{cx+=P[i].x;cy+=P[i].y});if(act.length){cx/=act.length;cy/=act.length}
  act.forEach(i=>{const p=P[i];if(p.fx!=null){p.x=p.fx;p.y=p.fy;p.vx=p.vy=0;return}p.vx=Math.max(-24,Math.min(24,(p.vx-p.x*.01*a/gyk())*.62));p.vy=Math.max(-24,Math.min(24,(p.vy-p.y*.01*gyk()*a)*.62));p.x+=p.vx-cx*.05;p.y+=p.vy-cy*.05});
  alpha*=.985;
 }else if(!untangled){untangle(act);untangled=true}
 for(let i=0;i<N;i++){if(isOn(i))continue;const nb=adj[i].map(k=>other(k,i)).filter(isOn);if(nb.length){let cx=0,cy=0;nb.forEach(j=>{cx+=P[j].x;cy+=P[j].y});P[i].x+=(cx/nb.length-P[i].x)*.05;P[i].y+=(cy/nb.length-P[i].y)*.05}}
}
// ---- desenredo al enfriarse: menos cruces de flechas y flechas sobre actores
const ccw=(a,b,c)=>(c.y-a.y)*(b.x-a.x)-(b.y-a.y)*(c.x-a.x);
const segX=(a,b,c,d)=>ccw(a,b,c)*ccw(a,b,d)<0&&ccw(c,d,a)*ccw(c,d,b)<0;
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function untangle(act){
 const ae=[];edges.forEach((e,k)=>{if(edgeOn(k))ae.push(e)});
 const inc=new Map();act.forEach(i=>inc.set(i,[]));ae.forEach(e=>{inc.get(e.s).push(e);inc.get(e.t).push(e)});
 const local=i=>{let c=0;for(const e of inc.get(i)){for(const f of ae){if(f===e||f.s===e.s||f.s===e.t||f.t===e.s||f.t===e.t)continue;if(segX(P[e.s],P[e.t],P[f.s],P[f.t]))c+=1000}
   for(const n of act){if(n===e.s||n===e.t)continue;if(distSeg(P[n],P[e.s],P[e.t])<P[n].r+14)c+=1000}c+=Math.hypot(P[e.s].x-P[e.t].x,P[e.s].y-P[e.t].y)*.02}
  for(const f of ae){if(f.s===i||f.t===i)continue;if(distSeg(P[i],P[f.s],P[f.t])<P[i].r+14)c+=1000}
  for(const n of act){if(n===i)continue;if(Math.hypot(P[i].x-P[n].x,P[i].y-P[n].y)<P[i].r+P[n].r+40)c+=800}return c};
 for(let it=0;it<9000&&act.length>2;it++){const i=act[(Math.random()*act.length)|0],ox=P[i].x,oy=P[i].y,b=local(i),s=15+90*(1-it/9000);P[i].x+=(Math.random()-.5)*2*s;P[i].y+=(Math.random()-.5)*2*s;if(local(i)>b){P[i].x=ox;P[i].y=oy}}
}
function reheat(a){alpha=Math.max(alpha,a);untangled=false}
// ---- dibujo
const T0=performance.now();
const focus=()=>hover>=0?hover:sel;
function draw(now){
 step();
 const t=(now-T0)/1000,f=focus();
 for(let i=0;i<N;i++){const p=P[i];els[i].style.transform=`translate(${p.x}px,${p.y}px)`;els[i].style.setProperty('--r',p.r.toFixed(1))}
 edges.forEach((e,k)=>{const o=E[k],on=edgeOn(k);o.g+=((on?1:0)-o.g)*.09;if(Math.abs((on?1:0)-o.g)<.01)o.g=on?1:0;
  const a=P[e.s],b=P[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,x1=a.x+ux*(a.r+3),y1=a.y+uy*(a.r+3),x2=b.x-ux*(b.r+5),y2=b.y-uy*(b.r+5),ex=x1+(x2-x1)*o.g,ey=y1+(y2-y1)*o.g;
  const touch=(f>=0&&(e.s===f||e.t===f))||k===selEdge,dim=(f>=0&&!touch&&k!==selEdge)||(hlType>=0&&e.type!==hlType)||(hlCat>=0&&nodes[e.s].cat!==hlCat&&nodes[e.t].cat!==hlCat);
  for(const l of [o.ln,o.hit]){l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',ex);l.setAttribute('y2',ey)}
  o.ln.style.opacity=o.g*(dim?.14:touch?1:.62);o.ln.setAttribute('stroke-width',(opts.thick?1+.9*e.w:1.7)+(touch?1:0));o.hit.classList.toggle('on',on);
  o.ps.forEach((c,q)=>{const u=((t*70/d+o.ph+q/2)%1);c.setAttribute('cx',x1+(x2-x1)*u);c.setAttribute('cy',y1+(y2-y1)*u);c.setAttribute('opacity',o.g>.95&&opts.flow?(dim?.08:.9):0)});
  const showChip=on&&(k===selEdge||k===hoverEdge);o.chip.classList.toggle('on',showChip);if(showChip)o.chip.style.transform=`translate(${(x1+x2)/2}px,${(y1+y2)/2}px) translate(-50%,-50%)`});

// ---- cámara
const cam={x:0,y:0,s:1};
function fitStep(snap){let a=1e9,b=1e9,c=-1e9,d=-1e9,n=0;for(let i=0;i<N;i++){if(!isOn(i))continue;const p=P[i];a=Math.min(a,p.x-p.r-30);c=Math.max(c,p.x+p.r+30);b=Math.min(b,p.y-p.r-10);d=Math.max(d,p.y+p.r+14);n++}
 if(!n)return;const vw=innerWidth,vh=innerHeight,narrow=vw<860,drOpen=drawer.classList.contains('on')&&!narrow,
  padL=24,padR=(drOpen?376:24),padT=narrow?190:96,padB=(window.__dockH||170)+34,w=Math.max(c-a,240),h=Math.max(d-b,160);
 const s=Math.min(1.25,(vw-padL-padR)/w,(vh-padT-padB)/h),tx=padL+((vw-padL-padR)-w*s)/2-a*s,ty=padT+((vh-padT-padB)-h*s)/2-b*s;
 if(snap){cam.s=s;cam.x=tx;cam.y=ty}else{cam.s+=(s-cam.s)*.07;cam.x+=(tx-cam.x)*.07;cam.y+=(ty-cam.y)*.07}}
// ---- acciones
const wasOn=new Array(N).fill(true);const snapshot=()=>{for(let i=0;i<N;i++)wasOn[i]=isOn(i)};
function changed(spawnFrom){hlCat=hlType=-1;recount();
 for(let i=0;i<N;i++){els[i].classList.toggle('off',!isOn(i));
  if(isOn(i)&&wasOn[i]===false){const nb=adj[i].map(k=>other(k,i)).filter(j=>isOn(j)&&j!==i);const src=spawnFrom!=null?P[spawnFrom]:nb.length?{x:nb.reduce((s,j)=>s+P[j].x,0)/nb.length,y:nb.reduce((s,j)=>s+P[j].y,0)/nb.length}:{x:0,y:0};P[i].x=src.x+(Math.random()-.5)*40;P[i].y=src.y+(Math.random()-.5)*40;P[i].vx=P[i].vy=0;P[i].r=8}}
 if(sel>=0&&!isOn(sel)){sel=-1;closeDrawer()}
 snapshot();decorate();reheat(.8);autofit=true;ui();if(sel>=0)drawNode(sel)}
function decorate(){const f=focus(),act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);act.sort((a,b)=>deg[b]-deg[a]);const hubs=new Set(opts.rings?act.slice(0,Math.min(4,act.length)).filter(i=>deg[i]>=4):[]);
 const nbr=f>=0?new Set(adj[f].filter(edgeOn).map(k=>other(k,f))):null;
 for(let i=0;i<N;i++){const on=isOn(i);const hlDim=on&&((hlCat>=0&&nodes[i].cat!==hlCat)||(hlType>=0&&!adj[i].some(k=>edgeOn(k)&&edges[k].type===hlType)));
  els[i].classList.toggle('hubn',hubs.has(i));degEls[i].textContent=deg[i];els[i].classList.toggle('sel',i===sel);els[i].classList.toggle('hov',i===hover);
  els[i].classList.toggle('dim',(f>=0&&i!==f&&on&&!nbr.has(i))||hlDim);
  els[i].classList.toggle('lab',on&&!hlDim&&(hubs.has(i)||i===f||(nbr&&nbr.has(i))||cam.s>.8))}}
function ripple(i){const r=document.createElement('div');r.className='ripple';r.style.left=P[i].x+'px';r.style.top=P[i].y+'px';r.style.setProperty('--c',capas[nodes[i].cat].color);world.appendChild(r);setTimeout(()=>r.remove(),1100)}
function toggleNode(i){if(off.has(i))off.delete(i);else off.add(i);changed()}
function pick(i){
 if(off.has(i))off.delete(i);
 if(reveal){let any=false;adj[i].forEach(k=>{const o=other(k,i);if(off.has(o)){off.delete(o);any=true}});if(any)changed(i)}
 else if(!isOn(i)){hiddenCat.delete(nodes[i].cat);changed()}
 sel=i;selEdge=-1;ripple(i);drawNode(i);decorate();autofit=true}
function pickEdge(k){selEdge=k;sel=-1;drawEdge(k);decorate()}
function closeDrawer(){drawer.classList.remove('on');sel=-1;selEdge=-1;decorate();autofit=true}
// ---- ficha lateral
const sec=(t,v)=>v?`<div class="sec"><h5>${t}</h5><p>${v}</p></div>`:'';
function drawNode(i){const n=nodes[i],c=capas[n.cat];drawer.style.setProperty('--c',c.color);
 const rels=adj[i].filter(edgeOn).map(k=>{const e=edges[k],o=other(k,i);return `<div class="rel" data-n="${o}"><i style="background:${tipos[e.type].color}"></i><div>${nodes[o].short}<small>${e.s===i?'→':'←'} ${tipos[e.type].name}</small></div></div>`}).join('');
 drawer.innerHTML=`<div class="hd"><span class="tag"><i></i>${c.badge}</span><h3>${n.name}</h3><div class="sub">${n.kind} · ${n.scale}</div><button class="x" data-x title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
  <div class="kpi"><div><b>${deg[i]}</b>conexiones activas</div><div><b>${adj[i].length}</b>en total</div></div>
  <div class="acts"><button class="btn" data-off><i class="fa-solid fa-power-off"></i> Apagar actor</button><button class="btn" data-iso title="Deja solo este actor y sus vecinos"><i class="fa-solid fa-bullseye"></i> Aislar vecinos</button></div></div>
  <div class="bd">${sec('Dónde está',n.loc)}${sec('Rol en el territorio',n.role)}${sec('Vulnerabilidad y poder',n.alert)}${sec('Capacidades',n.actors)}${sec('Control de información',n.ctrl)}${sec('Georreferenciación',n.geo)}<div class="sec"><h5>Relaciones activas (${deg[i]})</h5>${rels||'<p style="color:var(--mut)">Sin relaciones activas</p>'}</div></div>`;
 drawer.classList.add('on')}
function drawEdge(k){const e=edges[k],t=tipos[e.type];drawer.style.setProperty('--c',t.color);
 drawer.innerHTML=`<div class="hd"><span class="tag"><i></i>${t.name.toUpperCase()}</span><h3><a class="rel" data-n="${e.s}" style="display:inline;padding:0;margin:0;text-decoration:underline">${nodes[e.s].short}</a> → <a class="rel" data-n="${e.t}" style="display:inline;padding:0;margin:0;text-decoration:underline">${nodes[e.t].short}</a></h3><div class="sub">${e.detail}</div><button class="x" data-x title="Cerrar"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="bd">${sec('Mecanismo causal',e.why)}${sec('Asimetría de poder',e.power)}${sec('Impacto en sostenibilidad',e.impact)}${sec('Evidencia territorial',e.evidence)}</div>`;
 drawer.classList.add('on')}
drawer.addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(x){closeDrawer();return}
 const r=ev.target.closest('[data-n]');if(r){pick(+r.dataset.n);return}
 if(ev.target.closest('[data-off]')&&sel>=0){const i=sel;off.add(i);changed();return}
 if(ev.target.closest('[data-iso]')&&sel>=0){const keep=new Set([sel,...adj[sel].map(k=>other(k,sel))]);for(let i=0;i<N;i++){if(keep.has(i))off.delete(i);else off.add(i)}hiddenCat.clear();hiddenT.clear();changed()}});
// ---- barra: hubs, estadísticas, chips
function ui(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);const ne=edges.filter((e,k)=>edgeOn(k)).length;

 $('#stat').innerHTML=`<b>${act.length}</b> actores · <b>${ne}</b> relaciones`;
 $('#chCap').innerHTML=capas.map((c,i)=>{const n=nodes.filter((x,k)=>x.cat===i&&isOn(k)).length;return `<span class="fchip ${hiddenCat.has(i)?'off':''}" data-c="${i}" title="${c.desc}"><i style="background:${c.color}"></i>${shortCap(c)}<b>${n}</b></span>`}).join('');

 const of=$('#offrow'),offs=[...off];of.classList.toggle('on',offs.length>0);of.innerHTML=offs.length?'<span class="k">Apagados</span>'+offs.map(i=>`<span class="fchip off" data-o="${i}" title="Clic para encender" style="text-decoration:none;opacity:.85"><i style="background:${capas[nodes[i].cat].color}"></i>${nodes[i].short.slice(0,24)} <i class="fa-solid fa-plus" style="width:auto;height:auto;background:none;font-size:10px"></i></span>`).join('')+'<button class="btn" data-allon style="height:26px">Encender todos</button>':'';
 requestAnimationFrame(()=>{window.__dockH=$('#dock').offsetHeight;document.documentElement.style.setProperty('--dockh',window.__dockH+'px')})}
$('#hubs').addEventListener('click',ev=>{const h=ev.target.closest('[data-n]');if(h)pick(+h.dataset.n)});
$('#offrow').addEventListener('click',ev=>{const o=ev.target.closest('[data-o]');if(o){off.delete(+o.dataset.o);changed();return}if(ev.target.closest('[data-allon]')){off.clear();changed()}});
$('#dock').addEventListener('click',ev=>{const it=ev.target.closest('.fchip');if(!it)return;const isC=it.dataset.c!=null,set=isC?hiddenCat:hiddenT,k=+(isC?it.dataset.c:it.dataset.t),n=isC?capas.length:tipos.length;
 if(ev.altKey){const solo=[...Array(n).keys()].every(i=>i===k?!set.has(i):set.has(i));set.clear();if(!solo)for(let i=0;i<n;i++)if(i!==k)set.add(i)}else{set.has(k)?set.delete(k):set.add(k)}changed()});

const POP=[['size','Tamaño = conexiones','Cuantas más relaciones activas, más grande el círculo.'],['rings','Anillo = hub','Los 4 actores más conectados llevan un anillo giratorio.'],['thick','Grosor = impacto','La línea es más gruesa cuanto mayor el impacto en sostenibilidad.'],['flow','Puntos = sentido','Los puntos viajan de origen a destino.']];

addEventListener('click',ev=>{if(!ev.target.closest('#pop,#bView'))$('#pop').classList.remove('on');if(!ev.target.closest('#search'))$('#results').classList.remove('on')});
// ---- buscador
const q=$('#q'),res=$('#results');let cur=0,list=[];

 res.innerHTML=list.length?list.map((i,j)=>`<div data-i="${i}" class="${j===0?'cur':''}"><i style="background:${capas[nodes[i].cat].color}"></i>${nodes[i].short}<small>${isOn(i)?deg[i]+' rel.':'apagado'}</small></div>`).join(''):'<div style="color:var(--mut);cursor:default">Sin resultados</div>';res.classList.add('on')}

addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#pop').classList.remove('on');if(drawer.classList.contains('on'))closeDrawer()}if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus()}});
