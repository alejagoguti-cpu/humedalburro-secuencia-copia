<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red POT — Kennedy (plana 2D)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--txt:#f1f4ff;--mut:#8b95b0;--line:rgba(255,255,255,.1);--glass:rgba(14,16,26,.82);--acc:#5b9dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,"Segoe UI",sans-serif;color:var(--txt);background:#000;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- lienzo ---------- */
#view{position:absolute;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.hit{stroke:transparent;stroke-width:16;pointer-events:none;cursor:pointer;fill:none}
.hit.on{pointer-events:stroke}
.ln{fill:none;stroke-linecap:round;pointer-events:none}
.chip{position:absolute;left:0;top:0;padding:3px 10px;border-radius:99px;font-size:11px;white-space:nowrap;background:#0b0d16;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .25s}
.chip.on{opacity:1}
.nd{position:absolute;left:0;top:0;width:0;height:0;--r:24}
.disc{position:absolute;left:0;top:0;width:calc(var(--r)*2px);height:calc(var(--r)*2px);margin:calc(var(--r)*-1px) 0 0 calc(var(--r)*-1px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6%;text-align:center;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(255,255,255,.02)),#000;border:2px solid var(--c);box-shadow:0 0 14px -4px var(--c);color:var(--c);
 transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.3,1.2),box-shadow .25s,background .25s}
.disc>i{font-size:calc(var(--f,11)*.95px);line-height:1;opacity:.9;margin-bottom:1px}
.nd.hubn .disc{animation:glow 2.8s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 30px 2px var(--c)}}
body.boot .disc{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i)*38ms)}@keyframes pop{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}
.tx{color:var(--txt);font-weight:600;font-size:calc(var(--f,11)*1px);line-height:1.17;white-space:nowrap;text-align:center;pointer-events:none}
.nd.sel .tx{color:#04122e}
.disc:hover{box-shadow:0 0 26px 0 var(--c)}
.nd.off .disc{opacity:0;transform:scale(.2);pointer-events:none}
.nd.sel .disc{background:var(--c);color:#000;box-shadow:0 0 34px 3px var(--c)}
.nd.dim .disc{opacity:.28}
.lb{position:absolute;left:0;top:calc(var(--r)*1px + 6px);transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11.5px;line-height:1.25;font-weight:500;color:var(--txt);text-shadow:0 1px 5px #000,0 0 3px #000;pointer-events:none;opacity:0;transition:opacity .3s}
.nd.lab .lb{opacity:1}
.nd.hubn .lb{font-size:13px;font-weight:700}
.nd.dim .lb{opacity:0}
.nd.off .lb{opacity:0}
.hubring{position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--c);opacity:0;pointer-events:none;transition:opacity .4s}
.nd.hubn .hubring{opacity:.85;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.deg{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;border-radius:99px;background:var(--c);color:#000;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;font-family:inherit;pointer-events:none}
.nd.hubn .deg,.nd.sel .deg,.nd.hov .deg{display:grid}
.ripple{position:absolute;border-radius:50%;border:2px solid var(--c);transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;pointer-events:none}
@keyframes rip{from{opacity:.8;width:40px;height:40px}to{opacity:0;width:360px;height:360px}}
/* ---------- interfaz ---------- */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.btn.on{background:rgba(91,157,255,.22);border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04122e;font-weight:600}
.btn.pri:hover{background:#7bb0ff}
.btn.ico{width:32px;padding:0;justify-content:center}
#top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 20px;pointer-events:none}
#top>*{pointer-events:auto}
#brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
#brand p{margin:3px 0 0;color:var(--mut);font-size:12px}
#hubs{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:nowrap}
#hubs .k{font-size:11px;color:var(--mut);margin-right:2px;letter-spacing:.05em}
.hubchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;cursor:pointer;max-width:176px;flex:none}
.hubchip:hover{background:rgba(255,255,255,.1)}
.hubchip i{width:9px;height:9px;border-radius:50%;flex:none}
.hubchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubchip b{color:var(--mut);font-weight:600}
#search{position:relative;width:280px}
#search input{width:100%;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--txt);padding:0 14px 0 34px;font:inherit;font-size:12.5px;outline:none}
#search input:focus{border-color:var(--acc)}
#search>i{position:absolute;left:13px;top:10px;color:var(--mut);font-size:12px}
#results{position:absolute;left:0;right:0;top:40px;border-radius:12px;overflow:hidden;display:none}
#results.on{display:block}
#results div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px}
#results div:hover,#results div.cur{background:rgba(255,255,255,.1)}
#results i{width:9px;height:9px;border-radius:50%;flex:none}
#results small{margin-left:auto;color:var(--mut)}
#actions{display:flex;align-items:center;gap:10px}
#stat{color:var(--mut);font-size:12px;white-space:nowrap}#stat b{color:var(--txt);font-weight:600}
/* barra inferior */
#dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;width:min(960px,calc(100vw - 32px));border-radius:16px;padding:12px 14px;display:grid;gap:9px}
#dock .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#dock .row>.k{width:78px;flex:none;font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.fchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;cursor:pointer;user-select:none;transition:opacity .15s,background .15s}
.fchip:hover{background:rgba(255,255,255,.1)}
.fchip i{width:9px;height:9px;border-radius:50%;flex:none}
.fchip i.l{width:14px;height:3px;border-radius:2px}
.fchip b{color:var(--mut);font-weight:600;font-size:11px}
.fchip.off{opacity:.4;text-decoration:line-through}
#offrow .fchip.off{text-decoration:none}
.fchip.off b{text-decoration:none}
#dock .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
#dock .tools .sp{flex:1}
#dock .hintx{font-size:11.5px;color:var(--mut)}
#offrow{position:absolute;left:50%;bottom:calc(var(--dockh,170px) + 28px);transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-radius:14px;max-width:min(760px,calc(100vw - 32px))}
#offrow.on{display:flex}
#offrow .k{font-size:11px;color:var(--mut);margin-right:4px}
#offrow .fchip{border-style:dashed}
#pop{position:absolute;z-index:7;width:280px;border-radius:14px;padding:6px;display:none}
#pop.on{display:block}
#pop .opt{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer}
#pop .opt:hover{background:rgba(255,255,255,.07)}
#pop .tgl{margin-top:2px;width:30px;height:17px;border-radius:99px;background:#2a2f40;position:relative;flex:none;transition:background .2s}
#pop .tgl::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
#pop .opt.on .tgl{background:var(--acc)}#pop .opt.on .tgl::after{transform:translateX(13px)}
#pop .opt b{display:block;font-weight:600;font-size:12.5px}#pop .opt span{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.35}
/* ficha */
#drawer{position:absolute;right:20px;top:76px;bottom:calc(var(--dockh,170px) + 36px);width:380px;z-index:6;border-radius:16px;display:none;flex-direction:column;overflow:hidden}
#drawer.on{display:flex}
#drawer .hd{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
#drawer .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;font-weight:600;color:var(--c)}
#drawer .tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#drawer h3{margin:6px 28px 4px 0;font-size:15px;line-height:1.3}
#drawer .sub{color:var(--mut);font-size:12px}
#drawer .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.07)}
#drawer .x:hover{background:rgba(255,255,255,.16)}
#drawer .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#drawer .bd{padding:6px 18px 18px;overflow:auto;flex:1}
#drawer .kpis{display:flex;gap:22px;margin-top:12px;align-items:flex-end}#drawer .kpis div{display:flex;flex-direction:column;gap:3px}#drawer .kpis b{font-size:20px;font-weight:650;line-height:1}#drawer .kpis span{font-size:11px;color:var(--mut)}
#drawer .pill{font-size:12px!important;line-height:1!important;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--t) 20%,transparent);color:var(--t);border:1px solid color-mix(in srgb,var(--t) 45%,transparent);font-weight:600!important}
#drawer .tabs{display:flex;gap:4px;margin:14px -4px -12px}#drawer .tabs button{flex:1;border:0;background:none;padding:9px 0 11px;color:var(--mut);font-size:12.5px;border-bottom:2px solid transparent;font-weight:600}#drawer .tabs button.on{color:var(--txt);border-color:var(--c)}#drawer .tabs em{font-style:normal;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px;font-size:11px;margin-left:3px}
#drawer .lead{margin:0 0 14px;line-height:1.55;font-size:13px}
#drawer .card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:12px}
#drawer .kv{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.4}#drawer .kv:last-child{border:0}#drawer .kv span{color:var(--mut)}#drawer .kv b{font-weight:500}
#drawer .loc{display:flex;gap:10px;padding:9px 0;font-size:12.5px;line-height:1.4}#drawer .loc i{color:var(--mut);margin-top:2px;width:14px;flex:none}
#drawer .rg{margin-bottom:12px}#drawer .rg h6{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#drawer .bd{scrollbar-width:thin;scrollbar-color:#333 transparent;padding-top:16px}
#drawer .sec{margin-top:14px}
#drawer .sec h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;font-weight:600}
#drawer .sec p{margin:0;line-height:1.5;font-size:12.5px}
#drawer .rel{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 -8px;border-radius:9px;cursor:pointer}
#drawer .rel:hover{background:rgba(255,255,255,.07)}
#drawer .rel i{width:3px;align-self:stretch;border-radius:2px;flex:none}
#drawer .rel div{line-height:1.3}#drawer .rel small{display:block;color:var(--mut);font-size:11px}
#drawer .kpi{display:flex;gap:18px;margin-top:10px}#drawer .kpi div{font-size:11px;color:var(--mut)}#drawer .kpi b{display:block;font-size:18px;color:var(--txt);font-weight:650}
#terr{position:absolute;inset:0;z-index:20;background:#000;display:none}
#terrLoad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:12.5px;z-index:1;transition:opacity .5s}#terrLoad b{color:var(--txt);font-size:14px}
#terrLoad .bar{width:240px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}#terrLoad .bar i{display:block;height:100%;width:3%;background:var(--acc);border-radius:99px;transition:width .4s}#terrLoad small{font-size:11px;opacity:.7;max-width:300px;text-align:center;line-height:1.4;margin-top:4px}
#terrLoad .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);animation:spin 1s linear infinite;margin-bottom:6px}
#terr.ready #terrLoad{opacity:0;pointer-events:none}#terr iframe{opacity:0;transition:opacity .9s}#terr.ready iframe{opacity:1}#terr.on{display:block}#terr iframe{width:100%;height:100%;border:0}#terrClose{position:absolute;left:20px;bottom:20px;z-index:21}
@media(min-width:861px){body.dr #drawer{bottom:18px}body.dr #dock{left:20px;transform:none;width:calc(100vw - 440px)}body.dr #offrow{left:20px;transform:none}}
@media(max-width:860px){
 #top{flex-wrap:wrap;padding:12px}#search{width:100%;order:3}#stat{display:none}
 #dock{bottom:10px;padding:10px;width:calc(100vw - 20px);gap:7px}#dock .row,#dock .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#dock .row::-webkit-scrollbar,#dock .tools::-webkit-scrollbar{display:none}#dock .row>.k{width:auto}#dock .fchip,#dock .btn{flex:none}#dock .hintx,#dock .sp{display:none}#brand{max-width:100%}#hubs{overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 24px)}
 #drawer{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--dockh,170px) + 20px);max-height:46vh}
}
</style>
</head>
<body>
<div id="view"><div id="world"><svg id="edges"></svg></div></div>
<div id="top">
 <div id="brand"><h1>Red POT · Kennedy</h1><p>Elementos tangibles · plano 2D</p><div id="hubs"></div></div>
 <div id="search" class="glass" style="border-radius:99px;border:0;background:none;backdrop-filter:none"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Buscar un actor…" autocomplete="off"><div id="results" class="glass"></div></div>
 <div id="actions"><span id="stat"></span><button class="btn pri" id="bMat"><i class="fa-solid fa-atom"></i> Ver en el territorio</button></div>
</div>
<div id="drawer" class="glass"></div>
<div id="offrow" class="glass"></div>
<div id="dock" class="glass">
 <div class="row"><span class="k">Capas</span><span id="chCap" style="display:contents"></span></div>
 <div class="row"><span class="k">Relaciones</span><span id="chTip" style="display:contents"></span></div>
 <div class="tools">
  <button class="btn" id="bMode" title="Empieza con un solo actor y cada clic activa a sus vecinos"><i class="fa-solid fa-diagram-successor"></i> Desplegar por clic</button>
  <button class="btn" id="bView"><i class="fa-solid fa-sliders"></i> Cómo leer el gráfico</button>
  <button class="btn" id="bFit"><i class="fa-solid fa-expand"></i> Centrar</button>
  <button class="btn" id="bAll"><i class="fa-solid fa-rotate-left"></i> Restablecer</button>
  <span class="sp"></span><span class="hintx">Doble clic apaga un actor · Alt+clic aísla un grupo</span>
 </div>
</div>
<div id="pop" class="glass"></div>
<div id="terr"><div id="terrLoad"><div class="spin"></div><b>Preparando el territorio</b><span id="terrMsg">Cargando la base 3D de Kennedy…</span><div class="bar"><i id="terrBar"></i></div><small>Son varios MB de calles, manzanas y edificios; solo se descargan la primera vez.</small></div><iframe id="terrFrame" title="Territorio de Kennedy"></iframe><button class="btn pri" id="terrClose"><i class="fa-solid fa-diagram-project"></i> Volver a la red</button></div>
<script>

ocalidad Kennedy 2024 (saludata.saludcapital.gov.co)","icon":"fa-house-flood-water"},{"id":"NOD-ACT07","name":"Instituto de Desarrollo Urbano (IDU)","short":"Instituto de Desarrollo Urbano","cat":6,"kind":"Actores y Redes de Gobernanza","scale":"Tecnológica","loc":"Distrital; obras viales en Kennedy","role":"Construcción y mantenimiento de la malla vial y el espacio público.","alert":"Obras viales que fragmentan o impermeabilizan.","actors":"IDU, contratistas, TransMilenio S.A.","ctrl":"¿El IDU incorpora criterios ecológicos en las obras viales?","geo":"IDU, respuestas a derechos de petición sobre la Calle 38 Sur y los accesos a Corabastos, enero y febrero de 2025 (idu.gov.co/Archivos_Portal/2025/servicio-a-la-ciudadania/consulte-sus-requerimientos/01-enero/03-01-25/202523600000011.pdf; .../02-febrero/18-02-25/202523600128891.pdf)","icon":"fa-helmet-safety"},{"id":"NOD-ACT08","name":"Empresa Metro de Bogotá y TransMilenio S.A.","short":"Empresa Metro de Bogotá y TransMilenio S.A.","cat":6,"kind":"Actores y Redes de Gobernanza","scale":"Tecnológica","loc":"Distrital; troncales y trazado del Metro en Kennedy","role":"Operación y expansión del transporte masivo.","alert":"Transformación morfológica y presión inmobiliaria en estaciones.","actors":"Empresa Metro, TransMilenio S.A., IDU.","ctrl":"¿Quién responde por los efectos socioecológicos del transporte masivo?","geo":"Empresa Metro de Bogotá, avance de la Línea 1 (bogota.gov.co/mi-ciudad/movilidad/avance-de-la-linea-1-del-metro-de-bogota-con-corte-febrero-2026); Decreto 555 de 2021, art. 567 (sdp.gov.co/sites/default/files/decreto_555_de_2021.pdf)","icon":"fa-bus"},{"id":"NOD-ACT09","name":"Secretaría del Hábitat y Caja de Vivienda Popular (CVP)","short":"Secretaría del Hábitat y Caja de Vivienda Popular","cat":6,"kind":"Actores y Redes de Gobernanza","scale":"Cultural","loc":"Distrital; AE16 y mejoramiento de barrios","role":"Vivienda social, titulación y mejoramiento integral.","alert":"Procesos institucionales con consulta pasiva.","actors":"SDHT, CVP, comunidades de borde.","ctrl":"¿La política de vivienda reconoce los liderazgos comunitarios?","geo":"Decreto 555 de 2021, arts. 385–388 (reasentamiento de familias), art. 526 y art. 529 (vivienda de interés social) (sdp.gov.co/sites/default/files/decreto_555_de_2021.pdf); Decreto 555 de 2021, art. 478 (listado de las 25 actuaciones estratégicas: n.º 9 Distrito Aeroportuario-Fontibón, 14 Montevideo, 15 Eje Tintal, 16 Porvenir, 17 Chucua La Vaca), art. 479 (objetivos y lineamientos) y art. 480 (priorización) (sdp.gov.co/sites/default/files/decreto_555_de_2021.pdf)","icon":"fa-key"},{"id":"NOD-ACT10","name":"Jardín Botánico (JBB) y academia (U. La Salle)","short":"Jardín Botánico y academia","cat":6,"kind":"Actores y Redes de Gobernanza","scale":"Natural / Cultural","loc":"Distrital; monitoreo y estudios de humedales","role":"Producción de conocimiento, monitoreo de biodiversidad y educación ambiental.","alert":"Monitoreo desigual y poco vinculado a las decisiones del POT.","actors":"JBB, universidades, colegios, colectivos.","ctrl":"¿El conocimiento científico incide en las decisiones urbanísticas?","geo":"Del Risco Torres et al. (2019), Red de interacciones bióticas de Bogotá D.C., Jardín Botánico de Bogotá (bogota.gov.co/mi-ciudad/ambiente/red-biotica-plataforma-digital-registro-de-interaccion-de-organismos); participación de la U. de La Salle: verificar cita completa (la referencia \"2024\" no pudo confirmarse)","icon":"fa-seedling"},{"id":"NOD-BIO06","name":"Conos de vuelo y corredores de avifauna","short":"Conos de vuelo y corredores de avifauna","cat":7,"kind":"Sujetos Multiespecie / Hábitat","scale":"Natural","loc":"Cielo y bordes de El Burro y La Vaca","role":"Desplazamiento crepuscular y migratorio de la avifauna.","alert":"Edificación en altura altera la sombra y los corredores de vuelo.","actors":"Aves de humedal y poblaciones migratorias.","ctrl":"¿El POT considera la tercera dimensión del hábitat?","geo":"Secretaría Distrital de Ambiente, Plan de Manejo Ambiental del humedal El Burro, formulado por el IDEA de la Universidad Nacional (ambientebogota.gov.co/documents/10184/804589/PMA+EL+BURRO.pdf); Pinilla, M., Pulido, L. D. y Cardona, C. M. (2024). Evaluación económica de servicios del humedal El Burro, Bogotá. Sociedad y Economía, 51, e10812872 (doi.org/10.25100/sye.v0i51.12872); conos de vuelo: hipótesis del grupo (verificar)","icon":"fa-feather"},{"id":"NOD-BIO07","name":"Anfibios de Kennedy (registros iNaturalist)","short":"Anfibios de Kennedy","cat":7,"kind":"Sujetos Multiespecie / Bioindicadores","scale":"Natural","loc":"9 registros del archivo Anfibios_Kennedy_INaturalist (coordenadas con geoprivacidad)","role":"Reproducción y refugio en cuerpos de agua y vegetación de borde.","alert":"Sensibles a contaminación hídrica, ruido y pérdida de hábitat húmedo.","actors":"Dendropsophus molitor, Rhinella horribilis, Hyloxalus subpunctatus, Pristimantis elegans, Bolitoglossa adspersa (según el archivo).","ctrl":"¿Los anfibios son bioindicadores olvidados de la calidad hídrica de Kennedy?","geo":"iNaturalist, registros de anfibios en Kennedy con geoprivacidad (archivo Anfibios_Kennedy_INaturalist.xlsx del grupo; ciencia participativa)","icon":"fa-frog"},{"id":"NOD-BIO08","name":"Vertimientos y conexiones erradas sin tratamiento","short":"Vertimientos y conexiones erradas sin tratamiento","cat":7,"kind":"Factores Abióticos / Presiones","scale":"Tecnológica","loc":"Río Fucha, canales y borde de Corabastos","role":"Aguas servidas que llegan a cuerpos de agua sin tratamiento.","alert":"El Fucha funciona como colector a cielo abierto (ver EDG-20).","actors":"Red de alcantarillado, industrias y vivienda.","ctrl":"¿Mientras persistan las conexiones erradas, la regeneración ecológica es posible?","geo":"Alcaldía de Bogotá, EAAB, Plan de Identificación y Corrección de Conexiones Erradas (bogota.gov.co/mi-ciudad/habitat/acueducto-cierra-conexiones-de-agua-que-contaminaban-rios-de-bogota); EAAB, PSMV: SDA, Resolución 3257 de 2007 y Resolución 03428 de 2017","icon":"fa-biohazard"}],"edges":[{"id":"EDG-01","s":0,"t":12,"type":0,"detail":"Conectividad Logística","why":"La AE09 está delimitada en el POT (Art. 479) como macro-nodo logístico de carga aérea. La conexión física existe porque todo el flujo terrestre de carga pesada que sale del aeropuerto hacia el sur y occidente de Bogotá debe ingresar obligatoriamente por la Calle 13 y Av. Centenario, convergiendo sobre la malla vial de Kennedy (Av. Américas/Cali), saturando su capacidad infraestructural.","impact":"Alta","w":2,"power":"Saturación vial extrema por camiones pesados, deterioro de la malla vial y emisiones de NO2 y PM2.5.","evidence":"POT Dec. 555 Art. 479 / Anexo Movilidad"},{"id":"EDG-02","s":0,"t":6,"type":1,"detail":"Colindancia y Presión Hidrológica","why":"El Humedal de Techo se ubica en el límite suroriental de influencia de la AE09. La conexión físico-hidrológica radica en que la transformación masiva de suelo en bodegas e industrias sella la superficie, alterando el drenaje natural de la cuenca del Río Fucha y descargando aguas de escorrentía con aceites, hidrocarburos y sedimentos sobre Techo a través del Canal Magdalena.","impact":"Severa","w":3,"power":"Escorrentía pluvial contaminada y presión de borde por parqueaderos y bodegas industriales.","evidence":"SiB Colombia / JBB 2023 / PMA Techo"},{"id":"EDG-03","s":0,"t":16,"type":3,"detail":"Encadenamiento Productivo","why":"Montevideo es la zona industrial consolidada contigua a Fontibón y Kennedy. La conexión socioeconómica radica en que la AE09 busca reconvertir el uso del suelo hacia logística de alta tecnología, induciendo una revalorización del suelo que presiona a la pequeña y mediana manufactura tradicional de Montevideo a relocalizarse.","impact":"Media","w":1,"power":"Gentrificación industrial: reemplazo de fábricas de mano de obra intensiva por bodegas automatizadas de bajo empleo por m2.","evidence":"POT Dec. 555 Art. 479 y 512"},{"id":"EDG-04","s":1,"t":4,"type":1,"detail":"Colindancia y Densificación","why":"La AE15 fomenta la densificación habitacional a lo largo de la Av. Guayacanes, limitando directamente con la Zona de Manejo y Preservación Ambiental (ZMPA) de El Burro. La conexión espacial y ecológica es directa: la construcción de torres residenciales de gran altura genera sombras continuas sobre el dosel vegetal, polución lumínica y barreras verticales para el vuelo de la avifauna.","impact":"Crítica","w":4,"power":"Presión sobre la ZMPA, sombras sobre el espejo de agua y perturbación de conos de vuelo crepuscular.","evidence":"PMA El Burro / Dec. 555 Art. 485"},{"id":"EDG-05","s":1,"t":13,"type":0,"detail":"Articulación de Movilidad","why":"La Av. Guayacanes es el eje vial sobre el cual el POT ancla la AE15. La conexión radica en que la norma supedita los mayores índices de edificabilidad y densificación a la capacidad de este corredor de transporte para movilizar a los nuevos residentes.","impact":"Alta","w":2,"power":"Inducción de demanda vehicular privada, congestión en horas pico e incremento de niveles sonoros diurnos y nocturnos.","evidence":"POT Dec. 555 Art. 485 / PTT-20260902-WA0037"},{"id":"EDG-06","s":1,"t":19,"type":0,"detail":"Integración de Equipamientos","why":"La Biblioteca El Tintal es el principal hito cultural y educativo del occidente de Kennedy. La conexión radica en que el POT plantea la AE15 articulando sus cesiones públicas y equipamientos de cuidado alrededor de este nodo para generar centralidad urbana.","impact":"Media","w":1,"power":"Integración física insuficiente: el entorno de la biblioteca sigue condicionado por barreras vehiculares de la Av. Cali.","evidence":"Matta (2021) / POT Dec. 555 Art. 485"},{"id":"EDG-07","s":1,"t":27,"type":3,"detail":"Captación de Plusvalías","why":"La ejecución material de la AE15 depende de planes parciales promovidos por constructoras privadas. La conexión es económica y normativa: el POT otorga derechos de mayor edificabilidad a cambio de cargas urbanísticas de espacio público y cesiones de suelo.","impact":"Alta","w":2,"power":"Lógica especulativa de maximización de rentabilidad: microapartamentos de alta densidad con mínimas áreas verdes reales por habitante.","evidence":"Guía de Entrega Corte I / Decreto 555"},{"id":"EDG-08","s":2,"t":14,"type":0,"detail":"Articulación Peatonal y Espacio Público","why":"La Alameda El Porvenir es el eje lineal de movilidad activa que atraviesa de sur a norte el área de la AE16. La conexión es morfológica: la actuación estratégica utiliza la alameda como espina dorsal peatonal para estructurar las nuevas manzanas residenciales.","impact":"Media","w":1,"power":"Deterioro de tramos por falta de alumbrado, invasión de comercio informal no regulado y déficit de arborización de sombrío.","evidence":"Matta (2021) / POT Dec. 555 Art. 486"},{"id":"EDG-09","s":2,"t":8,"type":1,"detail":"Frontera de Expansión Urbana","why":"El borde occidental de la AE16 limita con la planicie aluvial del Río Bogotá. La conexión es de borde físico-ecológico: representa la línea donde la ciudad construida se encuentra con la principal arteria fluvial de la sabana y su zona de amortiguación de crecientes.","impact":"Severa","w":3,"power":"Presión por ocupación informal en la planicie, riesgo latente de inundaciones y degradación del jarillón de contención.","evidence":"Sentencia Río Bogotá / POT Art. 486"},{"id":"EDG-10","s":2,"t":22,"type":7,"detail":"Participación Comunitaria","why":"Los barrios de borde en Porvenir surgieron por autoconstrucción. La conexión es social y de gobernanza: la AE16 busca regularizar predios e intervenir asentamientos donde operan organizaciones vecinales con arraigo histórico.","impact":"Alta","w":2,"power":"Procesos institucionales de consulta pasiva que no integran las redes de economía popular ni las demandas vecinales de empleo.","evidence":"DANE Kennedy / Guía Corte II"},{"id":"EDG-11","s":3,"t":5,"type":6,"detail":"Regeneración Ecosistémica Directa","why":"La AE17 se delimita alrededor de los dos fragmentos del Humedal La Vaca. La conexión es inmediata: la actuación estratégica tiene como justificación formal la recuperación ambiental de la cubeta hídrica y su articulación con el tejido barrial.","impact":"Crítica","w":4,"power":"La Vaca sigue atrapada entre muros de bodegas, vertimientos de aguas residuales y basuras, con sus sectores Norte y Sur desconectados.","evidence":"PMA Humedal La Vaca / POT Art. 487"},{"id":"EDG-12","s":3,"t":15,"type":6,"detail":"Mitigación de Fricción Económica","why":"Corabastos es el vecino colindante que define la dinámica metabólica de la AE17. La conexión radica en que el POT plantea la actuación para mitigar y ordenar los impactos ambientales, viales y de residuos de la central sobre el entorno urbano.","impact":"Crítica","w":4,"power":"Inercia corporativa de Corabastos que externaliza costos ambientales (lixiviados, olores, tráfico) hacia los barrios vecinos.","evidence":"PMA La Vaca / Reporte Académico"},{"id":"EDG-13","s":3,"t":17,"type":4,"detail":"Reordenamiento Socioeconómico","why":"En Patio Bonito y María Paz opera un ecosistema masivo de bodegas de reciclaje, carretilleros y venta informal de alimentos. La conexión radica en que la AE17 propone recuperar el espacio público donde estas comunidades desarrollan su subsistencia diaria.","impact":"Alta","w":2,"power":"Riesgo de desalojo y criminalización de recicladores y comerciantes populares sin opciones de reasentamiento productivo.","evidence":"Estudio Socioeconómico DANE / PMA La Vaca"},{"id":"EDG-14","s":15,"t":5,"type":1,"detail":"Vertimiento y Contaminación Metabólica","why":"Físicamente, el muro norte de Corabastos colinda con La Vaca. La conexión es de flujo metabólico residual: el lavado diario de miles de toneladas de verduras, tubérculos y cárnicos genera efluentes con alta carga orgánica (DBO5) que escurren hacia el humedal.","impact":"Crítica","w":4,"power":"El muro de Corabastos es el foco de vertimiento clandestino, acumulación de materia orgánica en descomposición y lixiviados ácidos.","evidence":"PMA La Vaca (SDA 2009) / Res. 3964/2019"},{"id":"EDG-15","s":15,"t":11,"type":3,"detail":"Sobrecarga de Tráfico Pesado","why":"Corabastos moviliza más de 12.000 toneladas diarias de alimentos en miles de camiones diésel que ingresan y salen por la Av. Cali. La conexión es física de canalización de tráfico pesado regional sobre la malla arterial de Kennedy.","impact":"Severa","w":3,"power":"Congestión vehicular permanente, deterioro estructural de la calzada, emisiones diésel (NO2) y ruido que supera los 80 dB(A).","evidence":"PTT-20260902-WA0040 / Reporte Académico"},{"id":"EDG-16","s":11,"t":4,"type":2,"detail":"Incisión y Fragmentación Física","why":"En 1998 la administración distrital construyó la Av. Ciudad de Cali cruzando el centro del Humedal El Burro. La conexión espacial es una herida física de infraestructura vial que partió la reserva en dos polígonos desconectados hidrológicamente.","impact":"Crítica","w":4,"power":"Fragmentación física irreversible: interrupción del flujo del agua superficial y terrestre, y efecto de borde permanente.","evidence":"PMA El Burro / Matta (2021)"},{"id":"EDG-17","s":11,"t":23,"type":2,"detail":"Barrera Acústica y Enmascaramiento","why":"El paso continuo de buses de TransMilenio y camiones genera niveles sonoros de 75 a 84.2 dB(A). La conexión es ecológico-sensorial: el ruido coincide con las frecuencias de vocalización de las aves acuáticas protegidas que habitan en los juncales contiguos.","impact":"Crítica","w":4,"power":"Enmascaramiento de cantos reproductivos del Cucarachero de pantano y estrés fisiológico crónico en la Tingua bogotana, provocando abandono de nidos.","evidence":"PMA El Burro (Proyecto de insonorización)"},{"id":"EDG-18","s":10,"t":17,"type":4,"detail":"Presión Inmobiliaria y Gentrificación","why":"El trazado del viaducto del Metro y la estación terminal en Portal Américas tocan directamente el borde de Patio Bonito. La conexión es de valorización del suelo: la llegada del metro desata apetito inmobiliario sobre barrios populares.","impact":"Alta","w":2,"power":"Presión de expulsión sobre inquilinatos y pequeños talleres populares por aumento del impuesto predial y arriendos comerciales.","evidence":"Empresa Metro / POT Dec. 555 Art. 182"},{"id":"EDG-19","s":28,"t":4,"type":6,"detail":"Manejo Hidráulico e Intervención Física","why":"La EAAB es la entidad responsable del régimen hidráulico de los humedales de Bogotá. La conexión es técnico-institucional: ejecuta obras de dragado, retiro de macrófitas y control de caudales pluviales que ingresan a El Burro.","impact":"Severa","w":3,"power":"Ingeniería dura: ingreso de maquinaria pesada que destruye microhábitats de orilla y remueve sedimentos bentónicos donde viven larvas de macroinvertebrados.","evidence":"PMA El Burro / Res. 3964/2019 SDA"},{"id":"EDG-20","s":28,"t":7,"type":6,"detail":"Saneamiento y Control de Vertimientos","why":"La EAAB opera la red matriz de alcantarillado que descarga en el Fucha. La conexión radica en la responsabilidad estatal de construir interceptores sanitarios para evitar que aguas negras sigan llegando sin tratamiento al río.","impact":"Severa","w":3,"power":"Retrasos en la eliminación de conexiones erradas clandestinas; el río Fucha sigue funcionando como colector a cielo abierto de aguas servidas.","evidence":"PSMV EAAB / POT Dec. 555 Art. 58"},{"id":"EDG-21","s":18,"t":17,"type":5,"detail":"Soporte Social a Mujeres Cuidadoras","why":"Las Manzanas del Cuidado prestan servicios de respiro y formación a mujeres en Patio Bonito. La conexión es socioespacial: atiende a la población femenina que sostiene la reproducción social en entornos populares de alta precariedad.","impact":"Media","w":1,"power":"Cobertura puntual insuficiente frente al universo de miles de mujeres que trabajan en informalidad en Corabastos y reciclaje.","evidence":"POT Dec. 555 Art. 381 / PTT-20260902-WA0037"},{"id":"EDG-22","s":21,"t":4,"type":7,"detail":"Custodia Territorial y Restauración Participativa","why":"Los colectivos comunitarios (Asinus, Ecotechobita) salvaron El Burro en los años 90 impidiendo que fuera rellenado totalmente por escombros. La conexión es de custodia biocultural: realizan siembras de árboles nativos, monitoreo de aves y defensa legal permanente.","impact":"Alta","w":2,"power":"Defensa comunitaria activa frente a intentos de invasión predial o intervenciones lesivas del Distrito; ciencia comunitaria autónoma.","evidence":"Matta (2021) / Cabildos Kennedy"},{"id":"EDG-23","s":21,"t":29,"type":7,"detail":"Exigibilidad de Derechos y Litigio Ambiental","why":"Los colectivos vecinales han interpuesto acciones populares y tutelas para obligar a la EAAB y a la SDA a proteger El Burro y La Vaca. La conexión es de control político y tensión jurídica entre ciudadanía organizada y burocracia estatal.","impact":"Alta","w":2,"power":"Relación conflictiva: la comunidad denuncia que el Distrito toma decisiones inconsultas y favorece intereses de constructores y vías.","evidence":"Fallo Acción Popular El Burro / Guía Corte II"},{"id":"EDG-24","s":22,"t":30,"type":7,"detail":"Demanda de Legalización y Servicios","why":"Las JAC de Patio Bonito canalizan las demandas históricas de titulación predial, pavimentación barrial y servicios públicos ante la SDP. La conexión es administrativa y de gestión territorial de base.","impact":"Media","w":1,"power":"Burocracia centralizada que dilata soluciones a problemas urgentes de inundaciones pluviales y déficit de parques barriales.","evidence":"UPL Kennedy / PTT-20260902-WA0037"},{"id":"EDG-25","s":24,"t":23,"type":5,"detail":"Soporte Trófico y Sitios de Nidificación","why":"El Saúco (Sambucus nigra) y el Capulí (Prunus serotina) ofrecen néctar continuo, frutos carnosos y follaje denso para el refugio de más de 38 especies de aves. La conexión es de dependencia biótica estricta: sostiene la cadena alimenticia de la avifauna en Kennedy.","impact":"Crítica","w":4,"power":"Nodos estructurantes de la red biótica: su remoción provoca el colapso trófico de aves residentes y migratorias en la localidad.","evidence":"Del Risco et al. (2022) / SiB Colombia"},{"id":"EDG-26","s":25,"t":5,"type":5,"detail":"Depuración Biológica de Aguas Residuales","why":"Las bacterias Nitrosomonas y Nitrobacter del biofiltro de La Vaca oxidan el amonio y nitritos tóxicos provenientes de aguas negras, transformándolos en nitratos que fertilizan los juncales. La conexión es el motor biológico invisible que mantiene el agua viva.","impact":"Severa","w":3,"power":"Mecanismo biológico fundamental: sin esta microbiota, la cubeta hídrica se convertiría en una fosa séptica anóxica con mortandad masiva de peces y fauna.","evidence":"PMA La Vaca / Res. 3964/2019 SDA"},{"id":"EDG-27","s":26,"t":4,"type":1,"detail":"Sellamiento y Bloqueo de Recarga Freática","why":"El sellamiento de más del 78% del suelo de Kennedy con asfalto y concreto impide que el agua lluvia se infiltre en el suelo. La conexión hidrogeológica es directa: corta la alimentación del acuífero freático que nutre los manantiales naturales de El Burro.","impact":"Crítica","w":4,"power":"El suelo consolidado actúa como un tejado impermeable gigante que deseca los humedales en verano y satura los colectores en invierno.","evidence":"Imágenes Sentinel-2 NDBI / Estudio EAAB"},{"id":"EDG-36","s":44,"t":34,"type":6,"detail":"Condicionamiento por amenaza","why":"La amenaza por inundación debería limitar la ocupación residencial en zonas bajas.","impact":"Alta","w":2,"power":"Ocupación residencial en sectores con encharcamiento recurrente.","evidence":"Inferencia del modelo v3 (verificar con el grupo) · IDIGER"},{"id":"EDG-37","s":26,"t":44,"type":1,"detail":"Sellamiento y escorrentía","why":"El suelo sellado multiplica la escorrentía y con ello la amenaza de inundación (ver EDG-27).","impact":"Alta","w":2,"power":"Inundaciones pluviales recurrentes.","evidence":"Inferencia del modelo v3 (verificar con el grupo) · EDG-27 / NDBI Sentinel-2"},{"id":"EDG-38","s":9,"t":26,"type":6,"detail":"Mitigación del sellamiento","why":"Los SuDS buscan infiltrar y retener agua in situ para reducir el sellamiento.","impact":"Severa","w":3,"power":"Aplicación marginal; mención retórica en el POT (ver EDG-27).","evidence":"Inferencia del modelo v3 (verificar con el grupo) · EDG-27 / Dec. 555 Art. 75"},{"id":"EDG-39","s":9,"t":32,"type":5,"detail":"Descarga hidráulica","why":"Los SuDS reducen la carga pluvial que llega a los canales.","impact":"Media","w":1,"power":"Los canales siguen recibiendo toda la escorrentía.","evidence":"Inferencia del modelo v3 (verificar con el grupo) · Dec. 555 Art. 75"},{"id":"EDG-40","s":20,"t":4,"type":5,"detail":"Educación ambiental","why":"Las aulas ambientales funcionan dentro de las reservas y sostienen la apropiación social del humedal.","impact":"Media","w":1,"power":"Presupuesto bajo y horarios restringidos.","evidence":"Inferencia del modelo v3 (verificar con el grupo) · SDA / Política de Humedales"},{"id":"EDG-41","s":48,"t":20,"type":5,"detail":"Soporte de conocimiento","why":"El JBB y la academia nutren los contenidos de las aulas ambientales.","impact":"Media","w":1,"power":"Articulación puntual y poco sostenida.","evidence":"Inferencia del modelo v3 (verificar con el grupo) · JBB / SDA"},{"id":"EDG-42","s":34,"t":26,"type":1,"detail":"Sellamiento por vivienda","why":"La consolidación residencial es una de las fuentes principales del sellamiento del suelo.","impact":"Alta","w":2,"power":"Más de 78% del suelo sellado (ver BIO05).","evidence":"Inferencia del modelo v3 (verificar con el grupo) · NDBI Sentinel-2 / EDG-27"},{"id":"EDG-43","s":2,"t":35,"type":6,"detail":"Consolidación de vivienda social","why":"La AE16 es el instrumento que promueve VIS/VIP en el borde occidental.","impact":"Alta","w":2,"power":"Riesgo de segregación por lejanía a empleo.","evidence":"Inferencia del modelo v3 (verific   <div class="bd">${sec('Mecanismo causal',e.why)}${sec('Asimetría de poder',e.power)}${sec('Impacto en sostenibilidad',e.impact)}${sec('Evidencia territorial',e.evidence)}</div>`;
 drawer.classList.add('on');document.body.classList.add('dr')}
drawer.addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(x){closeDrawer();return}
 const tb=ev.target.closest('[data-tab]');if(tb&&sel>=0){tab=tb.dataset.tab;drawNode(sel);return}
 const r=ev.target.closest('[data-n]');if(r){pick(+r.dataset.n);return}
 if(ev.target.closest('[data-off]')&&sel>=0){const i=sel;off.add(i);changed();return}
 if(ev.target.closest('[data-iso]')&&sel>=0){const keep=new Set([sel,...adj[sel].map(k=>other(k,sel))]);for(let i=0;i<N;i++){if(keep.has(i))off.delete(i);else off.add(i)}hiddenCat.clear();hiddenT.clear();changed()}});
// ---- barra: hubs, estadísticas, chips
function ui(){
 const act=[];for(let i=0;i<N;i++)if(isOn(i))act.push(i);const ne=edges.filter((e,k)=>edgeOn(k)).length;
 const hubs=act.slice().sort((a,b)=>deg[b]-deg[a]).slice(0,3).filter(i=>deg[i]>0);
 $('#hubs').innerHTML=hubs.length?'<span class="k">HUBS</span>'+hubs.map(i=>`<span class="hubchip" data-n="${i}" title="Actor con más conexiones activas"><i style="background:${capas[nodes[i].cat].color}"></i><span>${nodes[i].short}</span><b>${deg[i]}</b></span>`).join(''):'';
 $('#stat').innerHTML=`<b>${act.length}</b> actores · <b>${ne}</b> relaciones`;
 $('#chCap').innerHTML=capas.map((c,i)=>{const n=nodes.filter((x,k)=>x.cat===i&&isOn(k)).length;return `<span class="fchip ${hiddenCat.has(i)?'off':''}" data-c="${i}" title="${c.desc}"><i style="background:${c.color}"></i>${shortCap(c)}<b>${n}</b></span>`}).join('');
 $('#chTip').innerHTML=tipos.map((t,i)=>{const n=edges.filter((e,k)=>e.type===i&&edgeOn(k)).length;return `<span class="fchip ${hiddenT.has(i)?'off':''}" data-t="${i}" title="${t.name}: ${t.def}"><i class="l" style="background:${t.color}"></i>${shortTip(t)}<b>${n}</b></span>`}).join('');
 const of=$('#offrow'),offs=[...off],orphs=[...orph];of.classList.toggle('on',offs.length>0||orphs.length>0);
 const chip=(i,att,cls,ico,tt)=>'<span class="fchip '+cls+'" '+att+'="'+i+'" title="'+tt+'" style="opacity:.9"><i style="background:'+capas[nodes[i].cat].color+'"></i>'+nodes[i].short.slice(0,24)+' <i class="fa-solid '+ico+'" style="width:auto;height:auto;background:none;font-size:10px"></i></span>';
 of.innerHTML=(offs.length?'<span class="k">Apagados</span>'+offs.map(i=>chip(i,'data-o','off','fa-plus','Clic para encender (y reconectarlo)')).join(''):'')+
  (orphs.length?'<span class="k" style="margin-left:'+(offs.length?10:0)+'px">Ocultos sin conexiones</span>'+orphs.map(i=>chip(i,'data-r','off','fa-link','Se ocultó porque se quedó sin ninguna conexión. Clic para reconectarlo')).join(''):'')+
  (offs.length?'<button class="btn" data-allon style="height:26px">Encender todos</button>':'');
 requestAnimationFrame(()=>{window.__dockH=$('#dock').offsetHeight;document.documentElement.style.setProperty('--dockh',window.__dockH+'px')})}
$('#hubs').addEventListener('click',ev=>{const h=ev.target.closest('[data-n]');if(h)pick(+h.dataset.n)});
$('#offrow').addEventListener('click',ev=>{const o=ev.target.closest('[data-o]');if(o){const i=+o.dataset.o;off.delete(i);connect(i);changed();return}const rc=ev.target.closest('[data-r]');if(rc){reconnect(+rc.dataset.r);changed();return}if(ev.target.closest('[data-allon]')){off.clear();changed()}});
$('#dock').addEventListener('click',ev=>{const it=ev.target.closest('.fchip');if(!it)return;const isC=it.dataset.c!=null,set=isC?hiddenCat:hiddenT,k=+(isC?it.dataset.c:it.dataset.t),n=isC?capas.length:tipos.length;
 if(ev.altKey){const solo=[...Array(n).keys()].every(i=>i===k?!set.has(i):set.has(i));set.clear();if(!solo)for(let i=0;i<n;i++)if(i!==k)set.add(i)}else{set.has(k)?set.delete(k):set.add(k)}changed()});
$('#dock').addEventListener('mouseover',ev=>{const it=ev.target.closest('.fchip');const c=it&&it.dataset.c!=null?+it.dataset.c:-1,tp=it&&it.dataset.t!=null?+it.dataset.t:-1;if(c!==hlCat||tp!==hlType){hlCat=c;hlType=tp;decorate()}});
$('#dock').addEventListener('mouseleave',()=>{if(hlCat>=0||hlType>=0){hlCat=hlType=-1;decorate()}});
// ---- cómo leer el gráfico (popover)
const POP=[['size','Tamaño = conexiones','Cuantas más relaciones activas, más grande el círculo.'],['rings','Anillo = hub','Los 4 actores más conectados llevan un anillo giratorio.'],['thick','Grosor = impacto','La línea es más gruesa cuanto mayor el impacto en sostenibilidad.'],['flow','Puntos = sentido','Los puntos viajan de origen a destino.']];
function drawPop(){$('#pop').innerHTML=POP.map(([k,t,d])=>`<div class="opt ${opts[k]?'on':''}" data-k="${k}"><span class="tgl"></span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}
$('#bView').onclick=ev=>{ev.stopPropagation();const p=$('#pop');if(p.classList.toggle('on')){drawPop();const r=$('#bView').getBoundingClientRect();p.style.left=Math.max(12,Math.min(innerWidth-292,r.left))+'px';p.style.top=(r.top-p.offsetHeight-10)+'px'}};
$('#pop').addEventListener('click',ev=>{const o=ev.target.closest('.opt');if(!o)return;opts[o.dataset.k]=!opts[o.dataset.k];drawPop();changed()});
addEventListener('click',ev=>{if(!ev.target.closest('#pop,#bView'))$('#pop').classList.remove('on');if(!ev.target.closest('#search'))$('#results').classList.remove('on')});
// ---- buscador
const q=$('#q'),res=$('#results');let cur=0,list=[];
function renderRes(){const v=norm(q.value.trim());if(!v){res.classList.remove('on');return}list=nodes.map((n,i)=>i).filter(i=>norm(nodes[i].name).includes(v)).slice(0,7);cur=0;
 res.innerHTML=list.length?list.map((i,j)=>`<div data-i="${i}" class="${j===0?'cur':''}"><i style="background:${capas[nodes[i].cat].color}"></i>${nodes[i].short}<small>${isOn(i)?deg[i]+' rel.':'apagado'}</small></div>`).join(''):'<div style="color:var(--mut);cursor:default">Sin resultados</div>';res.classList.add('on')}
q.addEventListener('input',renderRes);q.addEventListener('focus',renderRes);
q.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&list.length){pick(list[cur]);q.value='';res.classList.remove('on');q.blur()}else if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();cur=(cur+(ev.key==='ArrowDown'?1:-1)+list.length)%list.length;[...res.children].forEach((c,j)=>c.classList.toggle('cur',j===cur))}else if(ev.key==='Escape'){q.value='';res.classList.remove('on');q.blur()}});
res.addEventListener('click',ev=>{const d=ev.target.closest('[data-i]');if(d){pick(+d.dataset.i);q.value='';res.classList.remove('on')}});
addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#pop').classList.remove('on');if(drawer.classList.contains('on'))closeDrawer()}if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus()}});
// ---- interacción con el lienzo
let dragN=null,dragV=null,moved=0,lastClick=0,lastId=-1;
els.forEach((el,i)=>{discs[i].addEventListener('pointerdown',ev=>{ev.stopPropagation();dragN=i;moved=0;discs[i].setPointerCapture(ev.pointerId);autofit=false;dragV={x:ev.clientX,y:ev.clientY}});
 discs[i].addEventListener('mouseenter',()=>{hover=i;decorate()});discs[i].addEventListener('mouseleave',()=>{if(hover===i){hover=-1;decorate()}})});
addEventListener('pointermove',ev=>{if(dragN==null)return;moved+=Math.abs(ev.clientX-dragV.x)+Math.abs(ev.clientY-dragV.y);const p=P[dragN];p.fx=p.x+(ev.clientX-dragV.x)/cam.s;p.fy=p.y+(ev.clientY-dragV.y)/cam.s;p.x=p.fx;p.y=p.fy;dragV={x:ev.clientX,y:ev.clientY};if(moved>5)reheat(.35)});
addEventListener('pointerup',()=>{if(dragN==null)return;const i=dragN;P[i].fx=P[i].fy=null;dragN=null;
 if(moved>5)useAnchor=false;
 if(moved<=5){const now=performance.now();if(lastId===i&&now-lastClick<380){toggleNode(i);lastId=-1}else{lastId=i;lastClick=now;pick(i)}}else{reheat(.3)}});
let pan=null;view.addEventListener('pointerdown',e=>{if(e.target!==view&&e.target!==world&&e.target.id!=='edges')return;pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};autofit=false;view.classList.add('drag');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!pan)return;cam.x=pan.cx+e.clientX-pan.x;cam.y=pan.cy+e.clientY-pan.y});
view.addEventListener('pointerup',()=>{pan=null;view.classList.remove('drag')});
view.addEventListener('wheel',e=>{e.preventDefault();autofit=false;const k=Math.exp(-e.deltaY*.0015),ns=Math.max(.15,Math.min(2.5,cam.s*k));cam.x=e.clientX-(e.clientX-cam.x)*ns/cam.s;cam.y=e.clientY-(e.clientY-cam.y)*ns/cam.s;cam.s=ns;decorate()},{passive:false});
view.addEventListener('click',e=>{if(e.target===view||e.target===world||e.target.id==='edges'){if(drawer.classList.contains('on'))closeDrawer()}});
// ---- botones
const setMode=v=>{reveal=v;$('#bMode').classList.toggle('on',v)};
$('#bMode').onclick=()=>{setMode(!reveal);if(reveal){const keep=sel>=0?sel:deg.indexOf(Math.max(...deg));for(let i=0;i<N;i++){if(i!==keep)off.add(i);else off.delete(i)}changed();pick(keep)}else{off.clear();changed()}};
$('#bAll').onclick=()=>{useAnchor=true;off.clear();hiddenCat.clear();hiddenT.clear();setMode(false);closeDrawer();changed()};
$('#bFit').onclick=()=>{autofit=true};
addEventListener('message',ev=>{const d=ev.data;if(!d)return;if(d.type==='territorio-listo')$('#terr').classList.add('ready');if(d.type==='territorio-progreso'){const p=Math.round(d.p*100);$('#terrBar').style.width=Math.max(4,p)+'%';$('#terrMsg').textContent='Cargando la base 3D de Kennedy… '+p+'%'}});
$('#bMat').onclick=()=>{$('#terr').classList.remove('ready');$('#terrBar').style.width='3%';$('#terrMsg').textContent='Cargando la base 3D de Kennedy…';const ids=nodes.map((n,i)=>i).filter(isOn).map(i=>nodes[i].id);$('#terrFrame').src=(DATA.terr||'red-actores.html')+'?ids='+encodeURIComponent(ids.join(','));$('#terr').classList.add('on')};
$('#terrClose').onclick=()=>{$('#terr').classList.remove('on','ready');$('#terrFrame').removeAttribute('src')};
addEventListener('resize',()=>{window.__dockH=$('#dock').offsetHeight;document.documentElement.style.setProperty('--dockh',window.__dockH+'px')});
// ---- arranque: red completa, sin nodo central
recount();snapshot();ui();
for(let i=0;i<N;i++){P[i].r=P[i].tr=radius(i)}
window.__dockH=$('#dock').offsetHeight;document.documentElement.style.setProperty('--dockh',window.__dockH+'px');
{const ord=[...Array(N).keys()].sort((a,b)=>nodes[a].cat-nodes[b].cat||a-b);ord.forEach((i,k)=>{const an=k/N*6.283;P[i].x=Math.cos(an)*420;P[i].y=Math.sin(an)*420/gyk()});}
alpha=1;for(let k=0;k<30;k++)step();untangled=false;
fitStep(true);decorate();document.body.classList.add('boot');setTimeout(()=>document.body.classList.remove('boot'),2800);
requestAnimationFrame(draw);
window.__net={P,TX,draw,edges,isOn,deg,off,toggleNode,step,fitStep,pick,setAlpha:a=>{alpha=a},get alpha(){return alpha}};
})();
</script>
